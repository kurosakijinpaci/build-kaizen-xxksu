      - name: Integrasikan SUSFS Jack (kernel-side, 4.19)
        if: ${{ env.SUSFS_ENABLE == 'true' }}
        working-directory: kernel
        run: |
          set -eo pipefail
          git config user.name "ci"; git config user.email "ci@local"
          P="$GITHUB_WORKSPACE/repo/${SUSFS_KERNEL_PATCH}"
          if [ ! -s "$P" ]; then
            echo "== Isi folder patches/ di repo workflow =="
            ls -la "$GITHUB_WORKSPACE/repo/patches" 2>/dev/null || echo "(folder patches/ tidak ada)"
            echo "::error::File '${SUSFS_KERNEL_PATCH}' tidak ada di repo ini. Commit susfs_patch_to_4.19.patch ke folder patches/ (atau ubah input susfs_kernel_patch)."
            exit 1
          fi
          echo "Patch: ${SUSFS_KERNEL_PATCH} ($(wc -l < "$P") baris, $(grep -c '^diff --git' "$P") berkas)"
          grep -E '^\+#define SUSFS_VERSION' "$P" || echo "::warning::patch tidak memuat SUSFS_VERSION"
          # Hunk newuname() di kernel/sys.c (SPOOF_UNAME) dikeluarkan dari patch dan dipasang lewat jangkar kode di bawah.
          # Konteks hunk itu berubah setiap tip CIP bergerak, itu penyebab "patch failed: kernel/sys.c" -> fallback fuzz 3.
          python3 - "$P" /tmp/susfs-nosys.patch <<'PYSTRIP'
          import re, sys
          src = open(sys.argv[1], encoding="utf-8", errors="surrogateescape").read()
          out, removed = [], 0
          for sec in re.split(r"(?m)^(?=diff --git )", src):
              if sec.startswith("diff --git a/kernel/sys.c "):
                  hs = re.split(r"(?m)^(?=@@ )", sec)
                  keep = [hs[0]]
                  for h in hs[1:]:
                      if "susfs_is_uname_spoof_buffer_set" in h:
                          removed += 1
                      else:
                          keep.append(h)
                  sec = "".join(keep)
              out.append(sec)
          if removed != 1:
              print("::error::hunk newuname() tidak ditemukan tepat satu kali di patch SUSFS (ditemukan %d)" % removed)
              sys.exit(1)
          open(sys.argv[2], "w", encoding="utf-8", errors="surrogateescape").write("".join(out))
          print("hunk newuname() kernel/sys.c dikeluarkan dari patch (dipasang lewat jangkar)")
          PYSTRIP
          P=/tmp/susfs-nosys.patch
          if git apply --check "$P" 2>/tmp/susfs-check.err; then
            git apply --whitespace=nowarn "$P"
            echo "git apply: bersih"
          else
            echo "::warning::Patch SUSFS tertanam di-rebase untuk tree hasil merge CIP+Maya, tetapi tree ini berbeda (CIP_PIN/branch/Maya diubah, atau tip CIP menyentuh berkas SUSFS). Memakai cadangan patch -F3; regenerasi patch bila ingin git apply bersih."
            echo "== git apply --check gagal (konteks tree berbeda dari patch) =="
            head -40 /tmp/susfs-check.err
            echo "== Cadangan: patch -p1 dengan fuzz 3 =="
            patch -p1 --forward --no-backup-if-mismatch -F3 < "$P" 2>&1 | tee /tmp/susfs-patch.log | tail -60 || true
            REJ="$(find . -name '*.rej' -not -path './.git/*' | sort)"
            # Hunk vfs_kern_mount() di fs/namespace.c ditolak karena tree ini memakai fs_context
            # (alloc_vfsmnt ada di vfs_create_mount()). Terapkan manual lalu cek ulang sisa reject.
            if [ "$REJ" = "./fs/namespace.c.rej" ] && grep -q 'vfs_kern_mount' fs/namespace.c.rej; then
              echo "== Hunk vfs_kern_mount() ditolak: diterapkan manual =="
              python3 - <<'PY'
          import re, sys
          p = "fs/namespace.c"
          s = open(p, encoding="utf-8", errors="surrogateescape").read()

          def diag(msg):
              print("::error::" + msg)
              lines = s.split("\n")
              print("== Diagnostik fs/namespace.c: baris vfs_kern_mount / vfs_create_mount / alloc_vfsmnt ==")
              for i, l in enumerate(lines, 1):
                  if re.search(r"vfs_kern_mount|vfs_create_mount|alloc_vfsmnt", l):
                      print("%d: %s" % (i, l))
              for i, l in enumerate(lines):
                  if "vfs_create_mount" in l and "EXPORT_SYMBOL" not in l and ";" not in l:
                      print("== Konteks sekitar baris %d ==" % (i + 1))
                      print("\n".join(lines[max(0, i - 2):i + 30]))
                      break
              sys.exit(1)

          def find_def(fname):
              pat = r"^[^\n;=]*\b" + fname + r"\s*\([^;{)]*(?:\([^)]*\)[^;{)]*)*\)\s*\n?\s*\{"
              for m in re.finditer(pat, s, re.M):
                  if "return" not in m.group(0).split(fname)[0]:
                      return m
              return None

          ALLOC = re.compile(r"^[ \t]*mnt[ \t]*=[ \t]*alloc_vfsmnt\(([^;]*)\);[^\n]*\n", re.M)
          # Kernel lama: alloc_vfsmnt() ada di vfs_kern_mount(). Kernel dengan fs_context (hasil backport/merge):
          # vfs_kern_mount() hanya memanggil fc_mount() dan alloc_vfsmnt() ada di vfs_create_mount().
          found = None
          for fname in ("vfs_kern_mount", "vfs_create_mount"):
              m = find_def(fname)
              if not m:
                  continue
              a = ALLOC.search(s, m.end())
              if a and a.start() - m.end() < 1200 and "\n}\n" not in s[m.end():a.start()]:
                  found = (fname, m, a)
                  break
          if not found:
              diag("'mnt = alloc_vfsmnt(...)' tidak ditemukan di vfs_kern_mount()/vfs_create_mount()")
          fname, m, a = found
          if "susfs_alloc_non_unshare_ksu_vfsmnt" in s[m.end():a.start()]:
              print("%s: sudah ter-patch" % fname); sys.exit(0)
          arg = " ".join(a.group(1).split())
          name_expr = arg if "?:" in arg or "?" in arg else (arg + " ?: \"none\"")
          if "fc->source" in arg:
              name_expr = "fc->source ?: \"none\""
          elif arg == "name":
              name_expr = "name ?:\"none\""
          pre = (
          "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
          "\t// - We will just stop checking for ksu process if /sdcard/Android is accessible,\n"
          "\t//   for the sake of performance\n"
          "\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {\n"
          "\t\tif (susfs_is_current_ksu_domain()) {\n"
          "\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(" + name_expr + ");\n"
          "\t\t\tgoto bypass_orig_flow;\n"
          "\t\t}\n"
          "\t}\n"
          "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
          "\n")
          post = (
          "\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
          "bypass_orig_flow:\n"
          "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n")
          s = s[:a.start()] + pre + s[a.start():a.end()] + post + s[a.end():]
          open(p, "w", encoding="utf-8", errors="surrogateescape").write(s)
          print("%s: hunk SUSFS diterapkan manual (alloc_vfsmnt(%s))" % (fname, arg))
          PY
              rm -f fs/namespace.c.rej
              REJ="$(find . -name '*.rej' -not -path './.git/*' | sort)"
              grep -q 'bypass_orig_flow' fs/namespace.c || { echo "::error::penerapan manual vfs_kern_mount() gagal"; exit 1; }
            fi
            find . -name '*.orig' -not -path './.git/*' -delete
            if [ -n "$REJ" ]; then
              echo "== Hunk ditolak =="; echo "$REJ"
              for f in $REJ; do echo "--- $f"; sed -n '1,80p' "$f"; done
              echo "::error::Patch SUSFS tidak cocok dengan tree ini (hunk ditolak, daftar di atas). Kirim log ini."
              exit 1
            fi
            grep -E 'fuzz|offset' /tmp/susfs-patch.log | head -20 || true
          fi
          # Pasang hook SPOOF_UNAME di newuname() (kernel/sys.c) lewat jangkar, tidak tergantung nomor baris/konteks.
          python3 - <<'PYUNAME'
          import re, sys
          p = "kernel/sys.c"
          s = open(p, encoding="utf-8", errors="surrogateescape").read()
          if "susfs_spoof_uname" in s:
              print("kernel/sys.c: hook uname sudah ter-patch"); sys.exit(0)
          m = re.search(r"^SYSCALL_DEFINE1\(newuname\b[^\n]*\n", s, re.M)
          if not m:
              print("::error::SYSCALL_DEFINE1(newuname, ...) tidak ditemukan di kernel/sys.c"); sys.exit(1)
          end = s.find("\n}\n", m.end())
          body = s[m.end():end]
          u = re.search(r"^[ \t]*up_read\(&uts_sem\);[^\n]*\n", body, re.M)
          if not u or not re.search(r"memcpy\(&tmp,\s*utsname\(\)", body[:u.start()]):
              print("::error::pola memcpy(&tmp, utsname()) + up_read(&uts_sem) tidak ditemukan di newuname()")
              print(body); sys.exit(1)
          hook = ("#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
                  "\tif (static_branch_likely(&susfs_is_uname_spoof_buffer_set))\n"
                  "\t\tsusfs_spoof_uname(&tmp);\n"
                  "#endif\n")
          decl = ("#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
                  "extern struct static_key_false susfs_is_uname_spoof_buffer_set;\n"
                  "extern void susfs_spoof_uname(struct new_utsname* tmp);\n"
                  "#endif\n")
          pos = m.end() + u.start()
          s = s[:pos] + hook + s[pos:]
          s = s[:m.start()] + decl + s[m.start():]
          open(p, "w", encoding="utf-8", errors="surrogateescape").write(s)
          print("kernel/sys.c: hook SPOOF_UNAME dipasang di newuname() lewat jangkar")
          PYUNAME
          grep -q 'susfs_spoof_uname(&tmp)' kernel/sys.c || { echo "::error::hook uname tidak terpasang di kernel/sys.c"; exit 1; }
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            test -f "$f" || { echo "::error::$f tidak ada setelah patch SUSFS"; exit 1; }
          done
          grep -q 'susfs.o' fs/Makefile || { echo "::error::fs/Makefile tidak membangun susfs.o"; exit 1; }
          SV="$(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h | head -1 | cut -d' ' -f3 | tr -d '"')"
          echo "SUSFS_VER=${SV}" >> "$GITHUB_ENV"
          case "$SV" in v2.4.*) ;; *) echo "::warning::SUSFS_VERSION '${SV}' bukan v2.4.x (cek file patch)";; esac
          # Semua opsi yang dipakai patch harus punya definisi Kconfig (diberikan langkah sisi-KernelSU di bawah)
          echo "== Opsi CONFIG_KSU_SUSFS_* yang dipakai patch =="
          grep -rhoE 'CONFIG_KSU_SUSFS[A-Z_]*' fs include kernel block mm security 2>/dev/null | sort -u
          # Pastikan berkas yang memakai simbol susfs_def.h (mis. fs/stat.c) meng-include-nya
          python3 - <<'PYINC'
          import re, subprocess, sys
          # Berkas yang memakai simbol dari include/linux/susfs_def.h harus meng-include-nya. Patch SUSFS 4.19 tidak
          # menambahkan include itu di semua berkas (mis. fs/stat.c) sehingga STATX_SUS_KSTAT / susfs_is_current_app_uid
          # "undeclared". Tambahkan include (dibungkus CONFIG_KSU_SUSFS) bila belum ada.
          SYM = re.compile(r"\b(STATX_SUS_KSTAT(?:_FUSE)?|susfs_is_current_app_uid|susfs_is_current_proc_umounted|"
                           r"susfs_set_current_proc_umounted|susfs_is_current_proc_no_su|susfs_set_current_proc_no_su|"
                           r"TIF_PROC_UMOUNTED|TIF_PROC_NO_SU|AS_FLAGS_SUS_(?:PATH|MOUNT|KSTAT|MAP)|AS_FLAGS_OPEN_REDIRECT|"
                           r"ND_STATE_(?:LOOKUP|OPEN)_LAST|ND_FLAGS_LOOKUP_LAST)\b")
          files = subprocess.run(["git", "diff", "--name-only", "HEAD"], capture_output=True, text=True).stdout.split()
          files += subprocess.run(["git", "ls-files", "--others", "--exclude-standard"], capture_output=True, text=True).stdout.split()
          fixed = []
          for f in sorted(set(files)):
              if not f.endswith(".c") or f == "fs/susfs.c":
                  continue
              try:
                  t = open(f, encoding="utf-8", errors="surrogateescape").read()
              except OSError:
                  continue
              if not SYM.search(t) or re.search(r'#\s*include\s*[<"]linux/susfs(_def)?\.h[>"]', t):
                  continue
              lines = t.split("\n")
              last = -1
              for i, l in enumerate(lines[:120]):
                  if re.match(r"\s*#\s*include\s", l):
                      last = i
              if last < 0:
                  print("::warning::%s memakai simbol susfs_def.h tapi tidak ada #include di awal berkas" % f)
                  continue
              # lewati bila #include terakhir berada di dalam blok #if ... (cari penutup sederhana)
              depth = 0
              for l in lines[:last + 1]:
                  if re.match(r"\s*#\s*if", l): depth += 1
                  elif re.match(r"\s*#\s*endif", l): depth -= 1
              while depth > 0 and last + 1 < len(lines):
                  last += 1
                  if re.match(r"\s*#\s*if", lines[last]): depth += 1
                  elif re.match(r"\s*#\s*endif", lines[last]): depth -= 1
              lines[last + 1:last + 1] = ["#ifdef CONFIG_KSU_SUSFS", "#include <linux/susfs_def.h>", "#endif // #ifdef CONFIG_KSU_SUSFS"]
              open(f, "w", encoding="utf-8", errors="surrogateescape").write("\n".join(lines))
              fixed.append(f)
          print("include susfs_def.h ditambahkan ke: " + (" ".join(fixed) if fixed else "(tidak ada yang perlu)"))
          PYINC
          git add -A
          git commit -q -m "Integrate SUSFS ${SV} (JackA1ltman NonGKI_Kernel_Build_2nd, 4.19)"
          echo "::notice::SUSFS ${SV} (kernel-side) terintegrasi"

      - name: Integrasikan fgetpriority (aerath-stuff, built-in)
        if: ${{ env.FGP_ENABLE == 'true' }}
        working-directory: kernel
        run: |
          set -eo pipefail
          git config user.name "ci"; git config user.email "ci@local"
          rm -rf /tmp/fgp
          git clone -q "$FGP_REPO" /tmp/fgp
          if [ -n "$FGP_REF" ]; then
            git -C /tmp/fgp checkout -q "$FGP_REF" \
              || { echo "::error::fgetpriority_ref '${FGP_REF}' tidak ditemukan di ${FGP_REPO}"; exit 1; }
          fi
          FGP_COMMIT="$(git -C /tmp/fgp rev-parse HEAD)"
          echo "FGP_COMMIT=${FGP_COMMIT}" >> "$GITHUB_ENV"
          git -C /tmp/fgp log -1 --format='fgetpriority: %h %s'
          grep -E '^version=' /tmp/fgp/module/module.prop || true
          for f in main.c routine.h routine_kp.c routine_raw.c arch.h kernel.h arm64_branch_insn.h Makefile Kconfig; do
            test -f "/tmp/fgp/kernel/$f" || { echo "::error::kernel/$f tidak ada di fgetpriority (struktur repo berubah)"; exit 1; }
          done
          rm -rf drivers/fgetpriority; mkdir -p drivers/fgetpriority
          cp -a /tmp/fgp/kernel/. drivers/fgetpriority/
          rm -f drivers/fgetpriority/Makefile.ddk drivers/fgetpriority/build_ddk.sh
          # Built-in saja (kernel ini non-modul): ubah tristate/default m menjadi bool/default y
          sed -i -E 's/^([[:space:]]*)tristate "uid filter"/\1bool "uid filter (getpriority hiding)"/; s/^([[:space:]]*)default m$/\1default y/' drivers/fgetpriority/Kconfig
          grep -q 'bool "uid filter' drivers/fgetpriority/Kconfig || { echo "::error::Kconfig fgetpriority gagal diubah ke bool"; cat drivers/fgetpriority/Kconfig; exit 1; }
          python3 - <<'PY'
          import re
          p = 'drivers/Kconfig'
          s = open(p, encoding='utf-8').read()
          line = 'source "drivers/fgetpriority/Kconfig"'
          if line not in s:
              i = s.rfind('\nendmenu')
              assert i >= 0, 'endmenu tidak ada di drivers/Kconfig'
              s = s[:i] + '\n' + line + s[i:]
              open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -q 'fgetpriority/' drivers/Makefile \
            || printf '\nobj-$(CONFIG_FGETPRIORITY) += fgetpriority/\n' >> drivers/Makefile
          grep -q 'drivers/fgetpriority/Kconfig' drivers/Kconfig
          grep -q 'fgetpriority/' drivers/Makefile
          # Hook memasang cabang baru di tempat find_user() dipanggil oleh sys_getpriority/setpriority/ioprio_*.
          # find_user() harus tetap fungsi sendiri; LTO bisa meng-inline-nya sehingga titik panggil tidak ditemukan.
          if grep -qE '^struct user_struct \*find_user\(kuid_t uid\)' kernel/user.c; then
            sed -i -E 's/^struct user_struct \*find_user\(kuid_t uid\)/noinline struct user_struct *find_user(kuid_t uid)/' kernel/user.c
            echo "::notice::find_user() ditandai noinline (kernel/user.c)"
          else
            grep -n 'find_user' kernel/user.c | head
            echo "::warning::deklarasi find_user() tidak sesuai dugaan; noinline tidak ditambahkan"
          fi
          git add -A
          git commit -q -m "Add fgetpriority ${FGP_COMMIT:0:8} (built-in)"
          echo "::notice::fgetpriority ${FGP_COMMIT:0:8} terintegrasi (built-in)"

      - name: Siapkan toolchain (AOSP Clang 23.0.1 / r614150)
        run: |
          set -eo pipefail
          GIT_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
          rm -rf clang aosp-clang
          OK=""
          # 1) UTAMA: rilis GitHub (aset arsip toolchain). Dipilih otomatis: aset .tar.*/.tgz/.zip, bukan sha/sig/txt.
          gh_clang() {
            local API="https://api.github.com/repos/${CLANG_GH_REPO}/releases?per_page=30" REL TAG URL NAME
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -o /tmp/rels.json "$API" || return 1
            if [ -n "${CLANG_GH_TAG}" ]; then
              REL="$(jq -c --arg t "$CLANG_GH_TAG" '[.[]|select(.tag_name==$t)][0]' /tmp/rels.json)"
            else
              REL="$(jq -c --arg p "$CLANG_GH_TAG_PREFIX" '[.[]|select((.tag_name|startswith($p)) and (.draft|not))][0]' /tmp/rels.json)"
            fi
            [ -n "$REL" ] && [ "$REL" != null ] || { echo "rilis tidak ditemukan (tag='${CLANG_GH_TAG}' prefix='${CLANG_GH_TAG_PREFIX}')"; return 1; }
            TAG="$(echo "$REL" | jq -r .tag_name)"
            echo "Rilis dipilih: $TAG"; echo "$REL" | jq -r '.assets[]|"  aset: \(.name) (\(.size) byte)"'
            URL="$(echo "$REL" | jq -r '[.assets[]|select(.name|test("\\.(tar\\.(gz|xz|zst|bz2)|tgz|zip)$"))|select(.name|test("sha|sig|md5";"i")|not)][0].browser_download_url')"
            NAME="$(basename "$URL")"
            [ -n "$URL" ] && [ "$URL" != null ] || { echo "tidak ada aset arsip di rilis $TAG"; return 1; }
            echo "Unduh: $NAME"
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o "/tmp/${NAME}" "$URL" || return 1
            rm -rf clang clang-x && mkdir -p clang-x
            case "$NAME" in
              *.zip) unzip -q "/tmp/${NAME}" -d clang-x || return 1 ;;
              *) tar -xf "/tmp/${NAME}" -C clang-x || return 1 ;;
            esac
            rm -f "/tmp/${NAME}"
            # arsip bisa berisi folder pembungkus: cari bin/clang lalu jadikan root-nya "clang"
            local BIN ROOT
            BIN="$(find clang-x -maxdepth 4 -path '*/bin/clang' \( -type f -o -type l \) | head -1)"
            [ -n "$BIN" ] || { echo "bin/clang tidak ditemukan di arsip"; find clang-x -maxdepth 2 | head -20; return 1; }
            ROOT="$(dirname "$(dirname "$BIN")")"
            mv "$ROOT" clang && rm -rf clang-x
            [ -x clang/bin/clang ] || return 1
            OK="github:${TAG}"
          }
          GH_TOKEN="${{ github.token }}"
          if gh_clang; then :; else echo "::warning::rilis GitHub tidak bisa dipakai, coba googlesource"; rm -rf clang clang-x; fi
          for BR in $CLANG_BRANCHES; do
            [ -z "$OK" ] || break
            echo "== Ambil ${CLANG_REV} dari branch ${BR} =="
            # 1) tarball langsung dari googlesource (+archive)
            rm -rf clang && mkdir -p clang
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o /tmp/clang.tar.gz \
                 "${GIT_URL}/+archive/refs/heads/${BR}/${CLANG_REV}.tar.gz" \
               && tar -xzf /tmp/clang.tar.gz -C clang \
               && [ -x clang/bin/clang ]; then
              OK="archive:${BR}"; break
            fi
            echo "tarball dari branch ${BR} gagal, coba clone parsial"
            rm -rf clang aosp-clang /tmp/clang.tar.gz
            # 2) cadangan: clone parsial + sparse-checkout hanya folder CLANG_REV
            if git clone -q --depth=1 --filter=blob:none --sparse -b "$BR" "$GIT_URL" aosp-clang \
               && git -C aosp-clang sparse-checkout set "$CLANG_REV" \
               && [ -x "aosp-clang/${CLANG_REV}/bin/clang" ]; then
              mv "aosp-clang/${CLANG_REV}" clang && rm -rf aosp-clang
              OK="git:${BR}"; break
            fi
            echo "clone parsial dari branch ${BR} gagal"
            rm -rf clang aosp-clang
          done
          rm -f /tmp/clang.tar.gz
          if [ -z "$OK" ]; then
            echo "::error::Toolchain tidak bisa diambil: rilis GitHub ${CLANG_GH_REPO} (prefix ${CLANG_GH_TAG_PREFIX}) gagal, dan ${CLANG_REV} tidak ada di branch (${CLANG_BRANCHES}) ${GIT_URL}. Lihat log di atas."
            exit 1
          fi
          echo "Toolchain diambil lewat: ${OK}"
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            [ -x "$GITHUB_WORKSPACE/clang/bin/$t" ] || { echo "::error::$t tidak ada di clang/bin"; ls "$GITHUB_WORKSPACE/clang/bin" | head -60; exit 1; }
          done
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | sed -n '1p'
          "$GITHUB_WORKSPACE/clang/bin/ld.lld" --version | sed -n '1p'
          # Kernel asli: "Android (16836431, based on r614150) clang version 23.0.1"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | sed -n '1p' | grep -q 'r614150' \
            || echo "::warning::versi clang bukan r614150 (cek baris versi di atas)"

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-whyred-${{ github.run_id }}
          restore-keys: ccache-whyred-

      - name: Setup xxKSU (backslashxx/KernelSU, tag rilis + SELinux terbaru dari master)
        # WAJIB di dalam tree kernel: symlink drivers/kernelsu -> ../KernelSU/kernel harus terbentuk di kernel/drivers,
        # dan langkah sesudahnya (path_umount, kallsyms, Build, upload log) membaca kernel/KernelSU.
        working-directory: kernel
        run: |
          set -eo pipefail
          # Langkah sama dengan kernel/setup.sh xxKSU: symlink drivers/kernelsu + entri di drivers/Makefile & drivers/Kconfig.
          rm -rf KernelSU
          git clone -q "$KSU_REPO" KernelSU
          git -C KernelSU fetch -q --tags --force || true
          if git -C KernelSU rev-parse -q --verify "refs/tags/${KSU_REF}^{commit}" >/dev/null; then
            git -C KernelSU checkout -q "refs/tags/${KSU_REF}"
            KSU_LABEL="$KSU_REF"
          elif git -C KernelSU rev-parse -q --verify "${KSU_REF}^{commit}" >/dev/null; then
            git -C KernelSU checkout -q --detach "${KSU_REF}"
            KSU_LABEL="$(git -C KernelSU describe --tags --abbrev=0 2>/dev/null || echo ksu)-$(git -C KernelSU rev-parse --short=8 HEAD)"
          else
            echo "== Tag terbaru di repo =="; git -C KernelSU tag --sort=-creatordate | sed -n '1,25p'
            echo "::error::'${KSU_REF}' bukan tag maupun commit di ${KSU_REPO}. Isi ksu_ref dengan tag atau hash commit."; exit 1
          fi
          BASE="$(git -C KernelSU rev-parse HEAD)"
          echo "== xxKSU di-checkout: ${KSU_LABEL} (${BASE:0:8}) =="
          git -C KernelSU log -1 --format='%h %s'

          # --- SELinux terbaru: ambil kernel/selinux dari ujung master (hanya folder itu; sisanya tetap di tag) ---
          SEL_NOTE="tag ${KSU_LABEL}"
          # "SELinux clean" = policy yang dimodifikasi KernelSU menaikkan nomor urut (seqno/latest_granting) seperti load policy
          # asli, bukan reset_avc_cache(0) yang membuat seqno statis dan mudah terdeteksi sebagai policy "dirty"
          # (xxKSU 43aceaee / tiann #3964). Dipakai untuk menolak kernel/selinux yang tidak memenuhi syarat itu.
          sel_is_clean() {
            [ "$(grep -cE 'reset_avc_cache\((get_latest_granting_inc\(\)|pol->latest_granting)\)' "$1")" -ge 2 ] \
              && ! grep -q 'reset_avc_cache(0)' "$1"
          }
          # Path kedua yang disinkronkan bersamaan: kernel/feature/selinux_hide.* (implementasi "selinux hide"
          # sesungguhnya -- kernel/selinux cuma soal generation tracking/seqno, bukan penyamaran ke app/root).
          # xxKSU aktif merevisi file ini di master (mis. tiann#3647 "spoof status page and avd seqno") sesudah
          # tag rilis dibuat, jadi disatukan di sini supaya ikut ter-update tiap build, tidak perlu ganti tag manual.
          SELHIDE_PATHS="kernel/feature/selinux_hide.c kernel/feature/selinux_hide.h"
          # Sanity check murah (bukan pengganti kompilasi): pastikan ke-4 hook penyamaran yang dipakai xxKSU masih
          # ada namanya di file ini. Kalau refactor besar mengganti nama fungsi-fungsi ini, anggap tidak "clean"
          # untuk dipakai parsial (daripada bisa gagal link/compile dengan file lain yang masih versi tag).
          selhide_is_clean() {
            for fn in ksu_hide_setprocattr_inline ksu_hide_setxattr_inline ksu_selinux_transaction_write ksu_sel_open_handle_status ksu_selinux_hide_init; do
              grep -q "$fn" "$1" || return 1
            done
            return 0
          }
          if [ "$KSU_SELINUX_MASTER" = "true" ]; then
            git -C KernelSU fetch -q origin master
            MASTER="$(git -C KernelSU rev-parse origin/master)"
            echo "== Commit master (${MASTER:0:8}) yang menyentuh kernel/selinux + selinux_hide sejak ${KSU_LABEL} =="
            git -C KernelSU log --format='%h %ad %s' --date=short "${BASE}..${MASTER}" -- kernel/selinux $SELHIDE_PATHS | head -25 || true
            if git -C KernelSU diff --quiet "$BASE" "$MASTER" -- kernel/selinux $SELHIDE_PATHS; then
              echo "::notice::kernel/selinux + selinux_hide di master identik dengan ${KSU_LABEL}: tidak ada perubahan baru"
              SEL_NOTE="tag ${KSU_LABEL} (master identik)"
            else
              git -C KernelSU diff --stat "$BASE" "$MASTER" -- kernel/selinux $SELHIDE_PATHS
              # Diambil SEKALIGUS (bukan terpisah): selinux_hide.c memakai backup_sepolicy/helper dari kernel/selinux,
              # jadi keduanya harus dari sumber yang sama supaya tidak hilang simbol saat kompilasi.
              git -C KernelSU checkout "$MASTER" -- kernel/selinux $SELHIDE_PATHS
              SEL_NOTE="kernel/selinux + selinux_hide dari master @ ${MASTER:0:8}"
              echo "::notice::kernel/selinux + selinux_hide diambil dari master @ ${MASTER:0:8}"
              BAD=""
              sel_is_clean KernelSU/kernel/selinux/rules.c || BAD="rules.c tidak clean (generation tracking hilang)"
              [ -z "$BAD" ] && { selhide_is_clean KernelSU/kernel/feature/selinux_hide.c || BAD="selinux_hide.c kehilangan hook inti"; }
              if [ -n "$BAD" ]; then
                echo "::warning::master @ ${MASTER:0:8} ditolak ($BAD): kembali ke versi tag ${KSU_LABEL} untuk kernel/selinux + selinux_hide"
                git -C KernelSU rm -rfq -- kernel/selinux $SELHIDE_PATHS
                git -C KernelSU checkout "$BASE" -- kernel/selinux $SELHIDE_PATHS
                SEL_NOTE="tag ${KSU_LABEL} (master @ ${MASTER:0:8} ditolak: $BAD)"
              fi
            fi
          fi
          # Gerbang akhir: apa pun sumbernya, kernel/selinux yang akan dibangun harus clean (gagal cepat sebelum build 30 menit).
          sel_is_clean KernelSU/kernel/selinux/rules.c \
            || { echo "::error::kernel/selinux xxKSU ${KSU_LABEL} tidak memuat generation tracking policy (seqno statis => policy terlihat dirty). Pakai ksu_ref yang lebih baru (>= v3.3.1-50)."; exit 1; }
          selhide_is_clean KernelSU/kernel/feature/selinux_hide.c \
            || { echo "::error::kernel/feature/selinux_hide.c xxKSU ${KSU_LABEL} kehilangan hook inti (my_write_context/my_write_access/initialize_fake_status)."; exit 1; }
          echo "::notice::SELinux clean: generation tracking + selinux_hide ada (${SEL_NOTE})"
          # --- Kecocokan driver <-> manager ---
          # 1) UAPI: ksud/manager menolak driver bila angka UAPI beda ("UAPI version mismatch ... Please update KernelSU!").
          UAPI_RE='KERNEL_SU_UAPI_VERSION[^0-9]*[0-9]+'
          UAPI_K="$(grep -oE "$UAPI_RE" KernelSU/kernel/include/uapi/supercall.h | grep -oE '[0-9]+$' | head -1)"
          UAPI_U="$(grep -oE "$UAPI_RE" KernelSU/uapi/supercall.h | grep -oE '[0-9]+$' | head -1)"
          echo "== UAPI: driver(kernel)=${UAPI_K:-?} manager/ksud(userspace)=${UAPI_U:-?} =="
          if [ -z "$UAPI_K" ] || [ "$UAPI_K" != "$UAPI_U" ]; then
            echo "::error::UAPI driver (${UAPI_K:-?}) beda dengan manager/ksud (${UAPI_U:-?}); manager tidak akan mau memakai driver ini."; exit 1
          fi
          # 2) Tanda tangan: sertifikat manager/dummy.keystore (dipakai manager buatan repo ini) harus ada di apk_sign.c.
          KT="$(command -v keytool || true)"; [ -n "$KT" ] || { [ -n "${JAVA_HOME:-}" ] && KT="$JAVA_HOME/bin/keytool"; }
          if [ -n "$KT" ] && [ -x "$KT" ] && [ -f KernelSU/manager/dummy.keystore ]; then
            "$KT" -exportcert -alias alias -keystore KernelSU/manager/dummy.keystore -storepass password -file /tmp/ksu-cert.der >/dev/null 2>&1
            CERT_SZ="$(stat -c%s /tmp/ksu-cert.der)"; CERT_HASH="$(sha256sum /tmp/ksu-cert.der | cut -d' ' -f1)"
            echo "== Sertifikat manager (dummy.keystore): size=$(printf '0x%04x' "$CERT_SZ") sha256=${CERT_HASH} =="
            if grep -qi "$CERT_HASH" KernelSU/kernel/manager/apk_sign.c \
               && grep -qiE "0x0*$(printf '%x' "$CERT_SZ")[,)]" KernelSU/kernel/manager/apk_sign.c; then
              echo "OK      driver menerima tanda tangan manager buatan repo ini"
            else
              echo "::error::apk_sign.c tidak memuat sertifikat manager/dummy.keystore: manager dari rilis ini akan ditolak driver."; exit 1
            fi
          else
            echo "::warning::keytool/dummy.keystore tidak tersedia: pemeriksaan tanda tangan manager dilewati"
          fi
          # 3) Versi: manager = 30000 + jumlah commit - OFF (manager/build.gradle.kts; OFF dibaca dari sumber, v3.3.1-51 = 92);
          #    driver = -DKSU_VERSION di kernel/Makefile (di v3.3.1-51 bernilai 32731, tertinggal 1 dari manager 32732).
          CNT="$(git -C KernelSU rev-list --count "$BASE")"
          OFF="$(grep -oE '30000 \+ commitCount - [0-9]+' KernelSU/manager/build.gradle.kts | grep -oE '[0-9]+$' | head -1)"
          [ -n "$OFF" ] || { echo "::error::offset versionCode tidak ditemukan di KernelSU/manager/build.gradle.kts (rumus manager berubah)"; exit 1; }
          echo "offset versionCode manager (dari build.gradle.kts): ${OFF}"
          MGR_CODE=$((30000 + CNT - OFF))
          DRV_OLD="$(grep -oE 'DKSU_VERSION=[0-9]+' KernelSU/kernel/Makefile | head -1 | cut -d= -f2)"
          MIN_K="$(grep -oE 'MINIMAL_SUPPORTED_KERNEL = [0-9]+' KernelSU/manager/app/src/main/java/me/weishu/kernelsu/Natives.kt | grep -oE '[0-9]+$' | head -1)"
          echo "== Versi: manager versionCode=${MGR_CODE} (commit=${CNT}), driver Makefile=${DRV_OLD:-?}, minimal kernel yang didukung manager=${MIN_K:-?} =="
          DRV_FINAL="$DRV_OLD"
          if [ "$KSU_SYNC_VERSION" = "true" ]; then
            if [ -n "$MIN_K" ] && [ "$MGR_CODE" -lt "$MIN_K" ]; then
              echo "::warning::versionCode manager (${MGR_CODE}) < minimal kernel (${MIN_K}); versi driver dibiarkan ${DRV_OLD}"
            else
              sed -i -E "s/DKSU_VERSION=[0-9]+/DKSU_VERSION=${MGR_CODE}/" KernelSU/kernel/Makefile
              grep -q "DKSU_VERSION=${MGR_CODE}" KernelSU/kernel/Makefile || { echo "::error::gagal menyamakan KSU_VERSION"; exit 1; }
              DRV_FINAL="$MGR_CODE"
              echo "::notice::Versi driver disamakan dengan manager: ${DRV_OLD} -> ${DRV_FINAL}"
            fi
          elif [ -n "$MIN_K" ] && [ -n "$DRV_OLD" ] && [ "$DRV_OLD" -lt "$MIN_K" ]; then
            echo "::error::versi driver (${DRV_OLD}) di bawah minimal manager (${MIN_K})"; exit 1
          fi
          echo "KSU_MGR_CODE=${MGR_CODE}" >> "$GITHUB_ENV"
          echo "KSU_DRV_VERSION=${DRV_FINAL}" >> "$GITHUB_ENV"
          echo "KSU_LABEL=${KSU_LABEL}" >> "$GITHUB_ENV"
          echo "KSU_COMMIT=${BASE}" >> "$GITHUB_ENV"
          echo "KSU_SEL_NOTE=${SEL_NOTE}" >> "$GITHUB_ENV"

          test -d KernelSU/kernel
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile \
            || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig \
            || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          test -f drivers/kernelsu/ksu.c
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          grep -q 'kernelsu' drivers/Makefile

          echo "== Opsi Kconfig xxKSU =="
          grep -h -E '^[[:space:]]*config ' drivers/kernelsu/Kconfig || true
          echo "== Versi & identitas manager yang ditanam di driver =="
          grep -n -E 'KSU_VERSION=|KSU_PACKAGE_NAME :=|KSU_EXPECTED_SIZE :=|KSU_EXPECTED_HASH :=' drivers/kernelsu/Makefile | head -8 || true
          echo "== Tanda tangan manager yang diterima (apk_sign.c) =="
          grep -n -E '^\s*//\s*\S+|check_v2_signature\(path' drivers/kernelsu/manager/apk_sign.c | sed -n '1,20p' || true
          echo "::notice::xxKSU ${KSU_LABEL} (commit ${BASE:0:8}), SELinux: ${SEL_NOTE}. Driver v${DRV_FINAL} UAPI ${UAPI_K}; manager: APK dari rilis ${KSU_LABEL} (versionCode ${MGR_CODE})."


      - name: Pasang sisi KernelSU untuk SUSFS (10 opsi)
        if: ${{ env.SUSFS_ENABLE == 'true' }}
        working-directory: kernel
        run: |
          set -eo pipefail
          KP="$GITHUB_WORKSPACE/repo/${SUSFS_KSU_PATCH}"
          KK=KernelSU/kernel/Kconfig
          GLUE=no
          # Patch SUSFS sisi-KernelSU KHUSUS xxKSU (backslashxx/KernelSU): yapixel/xxksu_susfs_patch, "Patch 11".
          # (10_enable_susfs_for_ksu.patch bawaan SUSFS hanya cocok untuk KernelSU tiann/OriginSU.)
          XURL="${SUSFS_XXKSU_PATCH_URL:-https://raw.githubusercontent.com/yapixel/xxksu_susfs_patch/main/patches/xxksu/11_enable_susfs_for_ksu.patch}"
          XP=/tmp/11_enable_susfs_for_xxksu.patch
          rm -f "$XP"
          # Patch 11 ikut TERTANAM di workflow ini (patches/11_enable_susfs_for_xxksu.patch, sha256 1b62cec0495d3063 = yapixel main).
          # Diunduh dari URL hanya bila input/env SUSFS_XXKSU_PATCH_URL diisi eksplisit, atau berkas tertanam tidak ada.
          EMB11="$GITHUB_WORKSPACE/repo/patches/11_enable_susfs_for_xxksu.patch"
          if [ -z "${SUSFS_XXKSU_PATCH_URL:-}" ] && [ -s "$EMB11" ]; then
            cp "$EMB11" "$XP"; XURL="tertanam (patches/11_enable_susfs_for_xxksu.patch)"
          elif [ -n "$XURL" ]; then
            for n in 1 2 3 4; do
              curl -fsSL --retry 3 --connect-timeout 20 -o "$XP" "$XURL" && break
              echo "::warning::unduh patch xxKSU percobaan $n/4 gagal: $XURL"; rm -f "$XP"; sleep $((n*10))
            done
          fi
          if [ -s "$XP" ]; then
            echo "Patch xxKSU: $XURL ($(wc -l < "$XP") baris, $(grep -c '^diff --git' "$XP") berkas, sha256 $(sha256sum "$XP" | cut -c1-16))"
            grep -q 'KernelSU - SUSFS' "$XP" || { echo "::error::berkas yang diunduh bukan patch SUSFS untuk xxKSU"; head -5 "$XP"; exit 1; }
          fi
          if grep -qE '^[[:space:]]*config[[:space:]]+KSU_SUSFS[[:space:]]*$' "$KK"; then
            GLUE=bawaan
            echo "::notice::xxKSU ${KSU_LABEL} sudah punya opsi KSU_SUSFS di Kconfig-nya"
          elif [ -s "$XP" ] && git -C KernelSU apply --check "$XP" 2>/tmp/ksu-apply.err; then
            git -C KernelSU apply --whitespace=nowarn "$XP"
            GLUE=patch-xxksu
            echo "::notice::Patch SUSFS khusus xxKSU terpasang ke xxKSU ${KSU_LABEL}"
          elif [ -s "$XP" ] && patch -p1 -d KernelSU --forward --dry-run -F3 < "$XP" >/tmp/ksu-patch-dry.log 2>&1; then
            echo "== git apply --check gagal; patch -F3 dry-run bersih, diterapkan =="
            head -20 /tmp/ksu-apply.err 2>/dev/null || true
            patch -p1 -d KernelSU --forward --no-backup-if-mismatch -F3 < "$XP" | tail -30
            find KernelSU -name '*.orig' -delete
            GLUE=patch-xxksu
            echo "::notice::Patch SUSFS khusus xxKSU terpasang (dengan fuzz) ke xxKSU ${KSU_LABEL}"
          elif [ -s "$KP" ] && git -C KernelSU apply --check "$KP" 2>/tmp/ksu-apply.err; then
            git -C KernelSU apply --whitespace=nowarn "$KP"
            GLUE=patch
            echo "::notice::${SUSFS_KSU_PATCH} terpasang ke xxKSU ${KSU_LABEL}"
          else
            echo "== Sisi-KernelSU SUSFS TIDAK bisa dipasang ke xxKSU ${KSU_LABEL} =="
            [ -s "$XP" ] || echo "(patch xxKSU tidak berhasil diunduh dari ${XURL})"
            [ -s "$KP" ] || echo "(file ${SUSFS_KSU_PATCH} tidak ada di repo workflow)"
            head -30 /tmp/ksu-apply.err 2>/dev/null || true
            if [ -s "$XP" ]; then
              echo "== patch -F3 dry-run patch xxKSU =="; head -40 /tmp/ksu-patch-dry.log 2>/dev/null || true
              echo "== Berkas yang dituju patch xxKSU tetapi tidak ada di xxKSU =="
              grep '^diff --git' "$XP" | awk '{print $3}' | sed 's#^a/##' | while read -r f; do
                [ -e "KernelSU/$f" ] || echo "  tidak ada: $f"
              done
            fi
            if [ -s "$KP" ]; then
              echo "== Berkas yang dituju patch tetapi tidak ada di xxKSU =="
              grep '^diff --git' "$KP" | awk '{print $3}' | sed 's#^a/##' | while read -r f; do
                [ -e "KernelSU/$f" ] || echo "  tidak ada: $f"
              done
            fi
            echo "== Isi KernelSU/kernel dan gaya build xxKSU =="
            ls KernelSU/kernel | head -40
            grep -nE 'obj-|ksu\.o|kernelsu-objs' KernelSU/kernel/Makefile 2>/dev/null | head -10 || true
          fi

          if [ "$GLUE" = no ]; then
            if [ "$SUSFS_REQUIRE_GLUE" = true ]; then
              echo "::error::Sisi-KernelSU SUSFS tidak bisa dipasang ke xxKSU ${KSU_LABEL}. ${SUSFS_KSU_PATCH} dibuat untuk KernelSU tiann/OriginSU (Kbuild multi-berkas, hook manual); xxKSU di-build sebagai satu unit (ksu.o) dengan hook sendiri. Tanpa sisi-KernelSU, SUSFS di kernel tidak pernah diinisialisasi dan tidak bisa dikontrol dari userspace. Patch khusus xxKSU (yapixel/xxksu_susfs_patch) juga tidak cocok dengan xxKSU ${KSU_LABEL} (lihat diagnostik di atas). Pilihan: (1) pakai KernelSU tiann/OriginSU, atau (2) beri patch SUSFS khusus xxKSU lain lewat env SUSFS_XXKSU_PATCH_URL, atau (3) jalankan ulang dengan susfs_require_ksu_glue=false (SUSFS terkompilasi tetapi TIDAK aktif)."
              exit 1
            fi
            echo "::warning::susfs_require_ksu_glue=false: SUSFS dikompilasi tetapi TIDAK aktif (tanpa sisi-KernelSU)."
            [ -s "$KP" ] || { echo "::error::${SUSFS_KSU_PATCH} dibutuhkan untuk mengambil definisi 10 opsi Kconfig"; exit 1; }
            # Definisikan KSU_SUSFS + 10 opsi dari menu di patch supaya CONFIG_KSU_SUSFS_* ada di Kconfig tree.
            python3 - "$KP" fs/Kconfig.susfs <<'PY'
          import sys
          src, dst = sys.argv[1], sys.argv[2]
          out, on = [], False
          for l in open(src, encoding='utf-8', errors='replace').read().split('\n'):
              if not on and l.startswith('+menu "KernelSU - SUSFS"'):
                  on = True
              if on:
                  # hasil akhir hunk = baris tambahan (+) dan konteks ( ); baris hapus (-) dibuang
                  if l.startswith('-'):
                      continue
                  if l.startswith('+') or l.startswith(' '):
                      out.append(l[1:])
                  else:
                      break
                  if l.startswith('+endmenu'):
                      break
          if not out or not out[-1].startswith('endmenu'):
              sys.exit('::error::menu "KernelSU - SUSFS" tidak ditemukan di patch')
          syms = [x.split()[1] for x in out if x.startswith('config ')]
          open(dst, 'w', encoding='utf-8').write('# Opsi SUSFS (dari menu di 10_enable_susfs_for_ksu.patch). Sisi-KernelSU TIDAK dipasang.\n' + '\n'.join(out) + '\n')
          print('opsi Kconfig:', ' '.join(syms))
          PY
            grep -q 'Kconfig.susfs' fs/Kconfig || printf '\nsource "fs/Kconfig.susfs"\n' >> fs/Kconfig
          fi
          echo "SUSFS_GLUE=${GLUE}" >> "$GITHUB_ENV"
          echo "::notice::SUSFS sisi-KernelSU: ${GLUE}"

      - name: Lengkapi hook SELinux SUSFS (sepolicy.c, bagian patch 10 yang tidak ada di patch 11)
        if: ${{ env.SUSFS_ENABLE == 'true' }}
        working-directory: kernel
        run: |
          set -eo pipefail
          # Patch 11 (xxKSU) hanya memuat rules.c/selinux.c/selinux.h. Patch 10 (tiann) juga memasang hook di
          # kernel/selinux/sepolicy.c: susfs_add_sus_avd_allowed_by_type() dan susfs_add_sus_type().
          # Tanpa hook itu SUS_TYPE / SUS_AVD_ALLOWED di susfs.c tidak pernah terisi.
          F=drivers/kernelsu/selinux/sepolicy.c
          [ -f "$F" ] || F=KernelSU/kernel/selinux/sepolicy.c
          [ -f "$F" ] || { echo "::error::sepolicy.c tidak ditemukan"; exit 1; }
          cat > "$RUNNER_TEMP/susfs_sepolicy_fixup.py" <<'PY'
          #!/usr/bin/env python3
          # Melengkapi hunk SELinux patch 10 (tiann) yang TIDAK ada di patch 11 (xxKSU): hook SUSFS di kernel/selinux/sepolicy.c
          # (susfs_add_sus_avd_allowed_by_type di add_rule_raw, susfs_add_sus_type di add_type). Idempoten, gagal keras bila anchor hilang.
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          if "susfs_add_sus_type" in s:
              print("[skip] sepolicy.c sudah berisi hook SUSFS"); sys.exit(0)

          def once(s, old, new, label):
              if s.count(old) != 1:
                  print(f"::error::anchor '{label}' ditemukan {s.count(old)}x (harus 1x) di {p}"); sys.exit(1)
              return s.replace(old, new)

          s = once(s, "#define KSU_SUPPORT_ADD_TYPE\n",
           "#define KSU_SUPPORT_ADD_TYPE\n\n#ifdef CONFIG_KSU_SUSFS\n"
           "extern int susfs_add_sus_avd_allowed_by_type(u32 s_type, u32 t_type, u16 type, u32 orig_avd_allowed);\n"
           "extern int susfs_add_sus_type(const char *secctx, u32 type_value);\n#endif // #ifdef CONFIG_KSU_SUSFS\n", "define")

          # 1) add_rule_raw: sebelum node->datum.u.data diubah (nilai asli avd)
          s = once(s, "\t\tif (invert) {\n\t\t\tif (perm)\n",
           "#ifdef CONFIG_KSU_SUSFS\n\t\tsusfs_add_sus_avd_allowed_by_type(src->value, tgt->value, cls->value, node->datum.u.data);\n"
           "#endif // #ifdef CONFIG_KSU_SUSFS\n\n\t\tif (invert) {\n\t\t\tif (perm)\n", "add_rule_raw")

          # 2) add_type: bungkus (definisi asli diganti nama, wrapper memanggil hook setelah sukses)
          OLD = "static bool add_type(struct policydb *db, const char *type_name, bool attr)\n{\n"
          NEW = ("static bool ksu_add_type_orig(struct policydb *db, const char *type_name, bool attr);\n"
                 "static bool add_type(struct policydb *db, const char *type_name, bool attr)\n{\n"
                 "#ifdef CONFIG_KSU_SUSFS\n\tbool existed = symtab_search(&db->p_types, type_name) != NULL;\n#endif\n"
                 "\tbool ok = ksu_add_type_orig(db, type_name, attr);\n"
                 "#ifdef CONFIG_KSU_SUSFS\n\tif (ok && !existed) {\n"
                 "\t\tstruct type_datum *t = symtab_search(&db->p_types, type_name);\n"
                 "\t\tif (t)\n\t\t\tsusfs_add_sus_type(type_name, t->value);\n\t}\n#endif // #ifdef CONFIG_KSU_SUSFS\n"
                 "\treturn ok;\n}\n\n"
                 "static bool ksu_add_type_orig(struct policydb *db, const char *type_name, bool attr)\n{\n")
          s = once(s, OLD, NEW, "add_type")
          open(p, "w", encoding="utf-8").write(s)
          print("[ok] hook SUSFS dipasang di", p)
          PY
          python3 -I "$RUNNER_TEMP/susfs_sepolicy_fixup.py" "$F"
          grep -n "susfs_add_sus_type\|susfs_add_sus_avd_allowed_by_type" "$F"

      - name: Verifikasi SELinux bersih (generation tracking + hook SUSFS)
        working-directory: kernel
        run: |
          set -eo pipefail
          D=drivers/kernelsu/selinux
          [ -d "$D" ] || D=KernelSU/kernel/selinux
          K="${D%/selinux}"
          # 1) generation tracking (xxKSU 43aceaee / tiann #3964): seqno policy naik wajar seperti load policy asli, tidak statis 0
          GT="$(grep -cE 'reset_avc_cache\((get_latest_granting_inc\(\)|pol->latest_granting)\)' "$D/rules.c")"
          [ "$GT" -ge 2 ] \
            || { echo "::error::rules.c belum memakai generation tracking di kedua jalur (apply_kernelsu_rules & handle_sepolicy): policy akan terlihat dirty"; exit 1; }
          ! grep -q 'reset_avc_cache(0)' "$D/rules.c" || { echo "::error::masih ada reset_avc_cache(0) di rules.c"; exit 1; }
          # 2) jalur seqno yang benar-benar dipakai di kernel 4.19 ini (selinux_state->ss->latest_granting atau simbol latest_granting)
          if grep -q 'struct selinux_state ' security/selinux/include/security.h; then
            echo "OK      kernel punya struct selinux_state: seqno lewat selinux_state.ss->latest_granting"
            grep -q 'u32 latest_granting' security/selinux/ss/services.h \
              || echo "::warning::'u32 latest_granting' tidak ditemukan di security/selinux/ss/services.h; kompilasi rules.c akan memberi tahu bila field-nya beda"
          else
            echo "::warning::kernel tanpa struct selinux_state: seqno lewat simbol global latest_granting (kallsyms); pastikan KALLSYMS_ALL=y"
          fi
          # 3) nama domain/file KernelSU "ksu"/"ksu_file" (bukan "su" yang umum dideteksi) + fitur selinux_hide ikut terbangun
          grep -q '#define KERNEL_SU_DOMAIN "ksu"' "$D/selinux.h" \
            || echo "::warning::KERNEL_SU_DOMAIN bukan \"ksu\" di selinux.h (cek apakah ini disengaja)"
          if [ -f "$K/feature/selinux_hide.c" ] && grep -q 'ksu_selinux_hide_init();' "$K/ksu.c"; then
            echo "OK      selinux_hide terpasang (sembunyikan type/rule KernelSU dari app uid >= 10000)"
          else
            echo "::warning::fitur selinux_hide tidak ditemukan di xxKSU ini (tag lama?)"
          fi
          # 4) hook SUSFS di sepolicy.c dan rules.c (hanya bila SUSFS aktif DAN sisi-KernelSU terpasang)
          if [ "$SUSFS_ENABLE" = "true" ] && [ "${SUSFS_GLUE:-no}" != "no" ]; then
            grep -q susfs_add_sus_type "$D/sepolicy.c" && grep -q susfs_add_sus_avd_allowed_by_type "$D/sepolicy.c" \
              || { echo "::error::hook SUSFS di sepolicy.c tidak ada"; exit 1; }
            grep -q susfs_set_batch_sid "$D/rules.c" || { echo "::error::susfs_set_batch_sid tidak dipanggil di rules.c"; exit 1; }
          else
            echo "SUSFS nonaktif / sisi-KernelSU tidak terpasang: pemeriksaan hook SUSFS dilewati"
          fi
          echo "::notice::SELinux clean: generation tracking OK (${GT} titik reset_avc_cache)"

      - name: Rapikan warning macro fits_capacity (kernel/sched/cass.c)
        working-directory: kernel
        run: |
          set -eo pipefail
          # cass.c di-include dari fair.c (baris akhir) dan mendefinisikan ulang fits_capacity() dengan 2 argumen,
          # padahal fair.c sudah punya versi 3 argumen -> "warning: 'fits_capacity' macro redefined".
          # Definisi cass.c memang sudah berlaku saat ini; #undef di depannya hanya menghilangkan warning,
          # perilaku kernel tidak berubah.
          F=kernel/sched/cass.c
          if [ -f "$F" ] && grep -qE '^#define fits_capacity\(cap, max\)' "$F" \
               && ! grep -qE '^#undef fits_capacity' "$F"; then
            sed -i 's/^#define fits_capacity(cap, max)/#undef fits_capacity\n#define fits_capacity(cap, max)/' "$F"
            echo "::notice::#undef fits_capacity ditambahkan di $F"
          else
            echo "cass.c tidak perlu diubah"
          fi
          grep -n -B1 'define fits_capacity' "$F" || true

      - name: Backport path_umount() (fs/namespace.c, kernel 4.19)
        working-directory: kernel
        run: |
          set -eo pipefail
          # Hanya perlu bila driver memanggil path_umount() tetapi tidak mendefinisikannya sendiri (compat 4.19).
          if ! grep -rqE '\bpath_umount\(' drivers/kernelsu/ || grep -rqE '^(static )?(inline )?int path_umount\(' drivers/kernelsu/; then
            echo "path_umount() tidak diperlukan oleh driver ini (atau sudah didefinisikan driver): dilewati"; exit 0
          fi
          # Link error build sebelumnya: "undefined symbol: path_umount" (kernelsu/feature/kernel_umount.c).
          # path_umount() baru ada sejak Linux 5.9; tree 4.19 ini belum punya. Tambahkan versi 4.19
          # (logika sama dengan SYSCALL umount 4.19, tanpa lookup path dari userspace).
          F=fs/namespace.c
          if grep -qE '^int path_umount\(' "$F"; then
            echo "path_umount sudah ada, dilewati"
          else
            python3 - "$F" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          marker = 'SYSCALL_DEFINE2(umount,'
          assert s.count(marker) == 1, 'SYSCALL_DEFINE2(umount ditemukan %d kali' % s.count(marker)
          func = """/* Backport path_umount() dari Linux 5.9 untuk kernel 4.19 (dipakai KernelSU kernel_umount). */
          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = -EINVAL;
          	if (path->dentry != path->mnt->mnt_root)
          		goto out;
          	if (!check_mnt(mnt))
          		goto out;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		goto out;
          	ret = -EPERM;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		goto out;
          	ret = do_umount(mnt, flags);
          out:
          	/* jangan path_put(): itu akan menghapus mnt_expiry_mark */
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }

          """
          s = s.replace(marker, func + marker)
          open(p, 'w', encoding='utf-8').write(s)
          print('path_umount ditambahkan di', p)
          PY
          fi
          grep -n 'path_umount' "$F"
          grep -nE '^(static )?(int|void) (do_umount|check_mnt|mntput_no_expire)\(|^static .* check_mnt\(|^static int do_umount\(' "$F" || true

      - name: Sediakan kallsyms_on_each_symbol() (kernel/kallsyms.c, kernel 4.19)
        working-directory: kernel
        run: |
          set -eo pipefail
          # Hanya perlu bila driver memakai kallsyms_on_each_symbol() tetapi tidak mendefinisikannya sendiri.
          if ! grep -rqE 'kallsyms_on_each_symbol' drivers/kernelsu/ || grep -rqE '^(static )?(int|long) kallsyms_on_each_symbol\(' drivers/kernelsu/; then
            echo "kallsyms_on_each_symbol() tidak diperlukan oleh driver ini: dilewati"; exit 0
          fi
          # Link error build sebelumnya: "undefined symbol: kallsyms_on_each_symbol" (referenced by vmlinux.o:(try_kallsyms_on_each_symbol)).
          # kernel/kallsyms.o ikut dikompilasi, jadi fungsi ini tidak aktif di tree ini (tidak ada, atau dibungkus #if yang tidak terpenuhi).
          # Skrip memeriksa guard preprosesor di sekitar definisi; bila perlu, menambah definisi sendiri HANYA pada kondisi
          # ketika definisi asli tidak aktif (jadi tidak pernah dobel). Hanya simbol inti kernel (sama dengan versi mainline tanpa modul).
          python3 - <<'PY'
          import re, sys
          p = 'kernel/kallsyms.c'
          s = open(p, encoding='utf-8').read()
          for need in ('kallsyms_expand_symbol', 'kallsyms_sym_address', 'kallsyms_num_syms'):
              if need not in s:
                  sys.exit("::error::%s tidak ada di kernel/kallsyms.c, struktur berubah; kirim isi file ini" % need)
          if 'KSU_COMPAT_KALLSYMS_ON_EACH_SYMBOL' in s:
              print('sudah ditambahkan sebelumnya'); sys.exit(0)

          # Hitung guard preprosesor aktif di titik definisi (kalau ada).
          m = re.search(r'^(?:int|long)\s+kallsyms_on_each_symbol\s*\(', s, re.M)
          guards = []
          if m:
              stack = []
              for line in s[:m.start()].split('\n'):
                  t = line.strip()
                  if not t.startswith('#'): continue
                  d = re.sub(r'^#\s*', '', t)
                  if d.startswith('ifdef'):    stack.append('defined(%s)' % d.split()[1])
                  elif d.startswith('ifndef'): stack.append('!defined(%s)' % d.split()[1])
                  elif re.match(r'if\b', d):   stack.append('(%s)' % re.sub(r'/\*.*?\*/|//.*$', '', d[2:]).strip())
                  elif d.startswith('elif') or d.startswith('else'):
                      if stack: stack[-1] = '!(%s)' % stack[-1] if d.startswith('else') else '0'
                  elif d.startswith('endif'):
                      if stack: stack.pop()
              guards = stack
              print('Definisi asli ada di baris', s[:m.start()].count('\n') + 1, '| guard:', guards or '(tanpa guard)')
              if not guards:
                  # definisi tanpa guard tetapi tetap undefined -> bukan masalah guard; jangan menebak
                  i = s[:m.start()].count('\n')
                  print('\n'.join(s.split('\n')[max(0, i-8):i+25]))
                  sys.exit("::error::kallsyms_on_each_symbol terdefinisi tanpa guard, tetapi tidak ter-link; kirim keluaran ini")
          else:
              print('Definisi asli tidak ada di kernel/kallsyms.c')

          cond = ('#if !(%s)\n' % ' && '.join(guards)) if guards else ''
          end  = '#endif /* guard asli */\n' if guards else ''
          body = '''
          /* KSU_COMPAT_KALLSYMS_ON_EACH_SYMBOL: backport untuk kernel 4.19 (dipakai driver KernelSU). Hanya simbol inti kernel. */
          %sint kallsyms_on_each_symbol(int (*fn)(void *, const char *, struct module *, unsigned long), void *data)
          {
          \tchar namebuf[KSYM_NAME_LEN];
          \tunsigned long i;
          \tunsigned int off;
          \tint ret;

          \tfor (i = 0, off = 0; i < kallsyms_num_syms; i++) {
          \t\toff = kallsyms_expand_symbol(off, namebuf, ARRAY_SIZE(namebuf));
          \t\tret = fn(data, namebuf, NULL, kallsyms_sym_address(i));
          \t\tif (ret != 0)
          \t\t\treturn ret;
          \t}
          \treturn 0;
          }
          %s''' % (cond, end)
          import textwrap
          body = textwrap.dedent(body.replace('\n          ', '\n'))
          open(p, 'w', encoding='utf-8').write(s.rstrip('\n') + '\n' + body)
          print('kallsyms_on_each_symbol() ditambahkan di akhir', p)
          PY
          tail -30 kernel/kallsyms.c
          grep -n 'kallsyms_on_each_symbol' include/linux/kallsyms.h || echo "(tidak dideklarasikan di kallsyms.h; driver mendeklarasikan sendiri)"

      - name: Setup NoMount (v2.3.1)
        if: ${{ env.NOMOUNT_ENABLE == 'true' }}
        working-directory: kernel
        run: |
          set -eo pipefail
          # Cara yang sama dengan build munch (terbukti jalan di 4.19): setup.sh resmi dari TAG yang sama
          # dengan versi yang dipasang (bukan branch dev). Script membuat symlink fs/nomount -> NoMount/kernel/src
          # dan memasang Kconfig/Makefile. Kernel 4.19 legacy: LKM tidak bisa dipakai, wajib built-in.
          curl -fLSs -o /tmp/nomount-setup.sh \
            "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_TAG}/kernel/setup.sh"
          sh /tmp/nomount-setup.sh "${NOMOUNT_TAG}"

          echo "== NoMount yang terpasang =="
          git -C NoMount describe --tags --always

          test -L fs/nomount
          test -f fs/nomount/nomount.c
          grep -q 'fs/nomount/Kconfig' fs/Kconfig
          grep -q 'CONFIG_NOMOUNT' fs/Makefile
          echo "::notice::NoMount ${NOMOUNT_TAG} terintegrasi"

      - name: Izinkan KALLSYMS_ALL tanpa DEBUG_KERNEL (init/Kconfig)
        working-directory: kernel
        run: |
          set -eo pipefail
          # Kconfig 4.19: KALLSYMS_ALL "depends on DEBUG_KERNEL && KALLSYMS". Mengaktifkan DEBUG_KERNEL mengubah
          # banyak kode driver (qcacld-3.0: "incomplete type 'struct stack_trace'"), jadi cukup lepas dependensinya.
          # Efeknya hanya memasukkan simbol data ke kallsyms; non-GKI xxKSU mewajibkan KALLSYMS=y dan KALLSYMS_ALL=y.
          python3 - <<'PY'
          import re, sys
          p = 'init/Kconfig'
          s = open(p, encoding='utf-8').read()
          m = re.search(r'(config KALLSYMS_ALL\n(?:[^\n]*\n)*?\s*depends on )DEBUG_KERNEL && KALLSYMS', s)
          if not m:
              i = s.find('config KALLSYMS_ALL')
              print(s[i:i+400] if i >= 0 else 'config KALLSYMS_ALL tidak ada')
              sys.exit('::error::blok KALLSYMS_ALL di init/Kconfig tidak sesuai dugaan')
          s = s[:m.start()] + m.group(1) + 'KALLSYMS' + s[m.end():]
          open(p, 'w', encoding='utf-8').write(s)
          print('init/Kconfig: KALLSYMS_ALL tidak lagi butuh DEBUG_KERNEL')
          PY
          grep -n -A6 'config KALLSYMS_ALL' init/Kconfig

      - name: Tambah swap (cadangan memori untuk link LTO)
        if: ${{ env.OFFICIAL_OPTS == 'true' && env.LTO_MODE != 'none' }}
        run: |
          free -h
          sudo swapoff -a || true
          if sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile >/dev/null && sudo swapon /swapfile; then
            echo "::notice::Swap 8G aktif"
          else
            echo "::notice::Swap gagal dibuat, lanjut tanpa swap"
          fi
          free -h

      - name: Amankan flag warning clang baru (-Wno-default-const-init-unsafe)
        working-directory: kernel
        run: |
          set -eo pipefail
          # Flag ini baru dikenal clang 21+. Toolchain lama (clang 20, r547379) tidak mengenalnya; dengan clang 23 aman, langkah ini tetap sebagai pengaman: flag yang dipasang polos (tanpa cek compiler)
          # membuat SEMUA kompilasi gagal: "unknown warning option ... [-Werror,-Wunknown-warning-option]".
          # Asalnya dari source/CIP (Makefile), jadi dibungkus cc-disable-warning supaya hanya dipakai bila compiler mengenalinya.
          echo "== Lokasi flag sebelum diperbaiki =="
          git grep -n 'default-const-init-unsafe' -- 'Makefile' '*/Makefile' 'Makefile.*' '*/Makefile.*' '*.mk' || echo "(tidak ada di Makefile)"
          FILES="$(git grep -l -E -- '-Wno-default-const-init-unsafe' -- 'Makefile' '*/Makefile' 'Makefile.*' '*/Makefile.*' '*.mk' || true)"
          for F in $FILES; do
            sed -i -E 's/(^|[[:space:]])-Wno-default-const-init-unsafe/\1$(call cc-disable-warning, default-const-init-unsafe)/g' "$F"
            echo "diperbaiki: $F"
          done
          echo "== Sesudah =="
          git grep -n 'default-const-init-unsafe' -- 'Makefile' '*/Makefile' 'Makefile.*' '*/Makefile.*' '*.mk' || echo "(tidak ada)"
          # Pengaman: bila masih ada yang polos (mis. di berkas non-Makefile), cetak peringatan jelas
          if git grep -n -E -- '[^)]\s-Wno-default-const-init-unsafe' -- 'Makefile' '*/Makefile' 'Makefile.*' '*/Makefile.*' '*.mk' >/dev/null 2>&1; then
            echo "::warning::-Wno-default-const-init-unsafe polos masih ada di Makefile (lihat daftar di atas)"
          fi
          git grep -n 'default-const-init-unsafe' -- . ':!*Makefile*' ':!*.mk' | head -5 || true

      - name: Build kernel
        working-directory: kernel
        run: |
          set -eo pipefail
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G
          # ccache dipasang lewat symlink bernama "clang" di depan PATH, jadi CC cukup "clang".
          # (CC="ccache clang" bisa membuat deteksi CC_IS_CLANG / CLANG_VERSION / HAS_LTO_CLANG di Kconfig meleset.)
          mkdir -p "$HOME/ccache-bin"
          ln -sf "$(command -v ccache)" "$HOME/ccache-bin/clang"
          export PATH="$HOME/ccache-bin:$PATH"
          clang --version | sed -n '1p'
          MAKE_ARGS=(
            O=out ARCH=arm64
            CC=clang
            LD=ld.lld AR=llvm-ar NM=llvm-nm
            # HAS_LTO_CLANG (arch/Kconfig) menjalankan: test $(LLVM) -eq 1 dan test $(LLVM_IAS) -eq 1.
            # Tanpa dua variabel ini LTO_CLANG_* selalu ditolak olddefconfig (LTO_NONE).
            LLVM=1 LLVM_IAS=1
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            # LOCALVERSION= (kosong) mencegah scripts/setlocalversion menambah "+" (repo git tidak bersih/tanpa tag)
            LOCALVERSION=
          )
          make "${MAKE_ARGS[@]}" "${{ inputs.defconfig }}" 2>&1 | tee ../build.log

          echo "== Defconfig tree (SEBELUM diubah workflow): LTO / MEMCG / PSI =="
          grep -E '^(# )?CONFIG_(LTO[A-Z_]*|THINLTO|POLLY_CLANG|MEMCG[A-Z_]*|PSI|MODULES|KPROBES|FTRACE|TRACEPOINTS)[= ]' out/.config || echo "(tidak ada opsi terkait di defconfig)"

          # --- Nama kernel: pertahankan CONFIG_LOCALVERSION dari defconfig tree, lalu tambah "-<kernel_name>" ---
          # (contoh: -San-Kernel-Revenant-R1.1.108 + -xKaizen). uname -r terbaca di manager & Info ponsel.
          BASE_LV="$(sed -n 's/^CONFIG_LOCALVERSION="\(.*\)"$/\1/p' out/.config | head -1)"
          KERNEL_LOCALVERSION="${BASE_LV}-${{ inputs.kernel_name }}"
          echo "KERNEL_LOCALVERSION=${KERNEL_LOCALVERSION}" >> "$GITHUB_ENV"
          echo "::notice::LOCALVERSION defconfig '${BASE_LV}' -> '${KERNEL_LOCALVERSION}'"
          scripts/config --file out/.config \
            --set-str LOCALVERSION "${KERNEL_LOCALVERSION}" -d LOCALVERSION_AUTO

          # --- LTO + Polly (env OFFICIAL_OPTS, input lto_mode) ---
          has_sym() { git grep -qE "^(menu)?config[[:space:]]+$1[[:space:]]*\$" -- 'Kconfig*' '*/Kconfig*'; }
          # Status LTO nyata di out/.config: full | thin | none
          lto_state() {
            if grep -q '^CONFIG_LTO_CLANG_FULL=y' out/.config; then echo full
            elif grep -q '^CONFIG_LTO_CLANG_THIN=y' out/.config || grep -q '^CONFIG_THINLTO=y' out/.config; then echo thin
            elif grep -q '^CONFIG_LTO_CLANG=y' out/.config; then echo full
            else echo none; fi
          }
          # Nyalakan LTO: $1 = full | thin. Mendukung dua gaya Kconfig (choice LTO_CLANG_FULL/THIN, atau LTO_CLANG + THINLTO ala CAF 4.19).
          lto_enable() {
            if has_sym LTO_CLANG_FULL; then
              if [ "$1" = full ]; then
                scripts/config --file out/.config -d LTO_NONE -d LTO_CLANG_THIN -e LTO_CLANG_FULL
              else
                scripts/config --file out/.config -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG_THIN
              fi
            elif has_sym LTO_CLANG; then
              scripts/config --file out/.config -e LTO_CLANG
              if has_sym THINLTO; then
                if [ "$1" = full ]; then scripts/config --file out/.config -d THINLTO; else scripts/config --file out/.config -e THINLTO; fi
              fi
            else
              return 1
            fi
          }
          # Diagnosis: cetak blok Kconfig + nilai config yang biasanya menjadi penghalang LTO.
          lto_diag() (
            set +e
            echo "== Diagnosis LTO: blok Kconfig =="
            for sym in LTO_CLANG_FULL LTO_CLANG_THIN HAS_LTO_CLANG LTO_CLANG ARCH_SUPPORTS_LTO_CLANG ARCH_SUPPORTS_LTO_CLANG_THIN THINLTO; do
              f="$(git grep -lE "^(menu)?config[[:space:]]+${sym}[[:space:]]*\$" -- 'Kconfig*' '*/Kconfig*' | sed -n '1p')"
              if [ -n "$f" ]; then echo "--- ${sym} (${f})"; grep -n -A16 -E "^(menu)?config[[:space:]]+${sym}[[:space:]]*\$" "$f" | sed -n '1,22p'; fi
            done
            echo "== Diagnosis LTO: nilai config terkait =="
            grep -E '^(# )?CONFIG_(CC_IS_CLANG|LD_IS_LLD|CLANG_VERSION|LTO[A-Z_]*|ARCH_SUPPORTS_LTO[A-Z_]*|HAS_LTO_CLANG|THINLTO|FTRACE|DYNAMIC_FTRACE|FTRACE_MCOUNT_RECORD|FTRACE_MCOUNT_USE_RECORDMCOUNT|KASAN|GCOV_KERNEL|MODVERSIONS|TRIM_UNUSED_KSYMS|COMPILE_TEST|SHADOW_CALL_STACK|CFI_CLANG|CPU_BIG_ENDIAN)[= ]' out/.config || true
            echo "== Diagnosis LTO: toolchain =="
            clang --version | sed -n '1p'; ld.lld --version | sed -n '1p'
            llvm-nm --help 2>&1 | sed -n '1p'; llvm-ar --help 2>&1 | sed -n '1p'
            echo "== Diagnosis LTO: variabel make =="
            printf '%s\n' "${MAKE_ARGS[@]}" | grep -E '^(LLVM|LLVM_IAS|CC|LD|AR|NM)='
            echo "== Diagnosis LTO: arm64 select ARCH_SUPPORTS_LTO_CLANG =="
            git grep -n 'ARCH_SUPPORTS_LTO_CLANG' -- arch/arm64/Kconfig
            exit 0
          )
          if [ "$OFFICIAL_OPTS" = "true" ]; then
            # LTO sesuai input lto_mode (full | thin | none). Hasil akhirnya diperiksa & di-fallback setelah olddefconfig.
            if [ "$LTO_MODE" = "none" ]; then
              echo "LTO dimatikan lewat input lto_mode=none"
            elif ! lto_enable "$LTO_MODE"; then
              echo "::warning::Simbol Kconfig LTO_CLANG / LTO_CLANG_FULL tidak ada di tree ini: LTO dilewati"
            fi
            # Polly: lewat Kconfig kalau ada; kalau tidak, lewat flag compiler (hanya flag yang diterima clang ini).
            if has_sym POLLY_CLANG; then
              scripts/config --file out/.config -e POLLY_CLANG
            elif git grep -qi 'polly' -- Makefile arch/arm64/Makefile; then
              echo "Makefile source sudah memuat flag Polly, tidak ditambah lagi"
            else
              PF=""
              for o in -polly -polly-run-dce -polly-run-inliner -polly-opt-fusion=max -polly-ast-use-context \
                       -polly-detect-keep-going -polly-vectorizer=stripmine -polly-invariant-load-hoisting; do
                if echo 'int x;' | clang --target=aarch64-linux-gnu -O2 -mllvm "$o" -x c -c - -o /dev/null 2>/dev/null; then
                  PF="$PF -mllvm $o"
                else
                  echo "flag Polly tidak didukung toolchain ini, dilewati: $o"
                fi
              done
              case "$PF" in
                *"-mllvm -polly "*|*"-mllvm -polly") MAKE_ARGS+=("KCFLAGS=${PF# }"); echo "::notice::Polly aktif lewat KCFLAGS:${PF}" ;;
                *) echo "::warning::Polly tidak didukung toolchain ini: dilewati" ;;
              esac
            fi
          fi

          # --- xxKSU (backslashxx/KernelSU): built-in; hook lewat ARM64 branch-link / syscall table + LSM hook (tanpa patch hook di sumber kernel) ---
          ksu_has() { grep -qE "^[[:space:]]*config[[:space:]]+$1([[:space:]]|$)" drivers/kernelsu/Kconfig; }
          scripts/config --file out/.config -e KSU -e KALLSYMS -e KALLSYMS_ALL -e SECCOMP
          HOOK_OPT=""
          if [ "$KSU_HOOK_MODE" = "syscall_table" ]; then
            if ksu_has KSU_TAMPER_SYSCALL_TABLE; then
              scripts/config --file out/.config -d KSU_HACK_ARM64_BRANCH_LINK -e KSU_TAMPER_SYSCALL_TABLE
              HOOK_OPT="CONFIG_KSU_TAMPER_SYSCALL_TABLE"
            else
              echo "::warning::KSU_TAMPER_SYSCALL_TABLE tidak ada di Kconfig xxKSU ${KSU_LABEL:-$KSU_REF}"
            fi
          else
            if ksu_has KSU_HACK_ARM64_BRANCH_LINK; then
              scripts/config --file out/.config -d KSU_TAMPER_SYSCALL_TABLE -e KSU_HACK_ARM64_BRANCH_LINK
              HOOK_OPT="CONFIG_KSU_HACK_ARM64_BRANCH_LINK"
            else
              echo "::warning::KSU_HACK_ARM64_BRANCH_LINK tidak ada di Kconfig xxKSU ${KSU_LABEL:-$KSU_REF}"
            fi
          fi
          echo "Mode hook xxKSU: ${KSU_HOOK_MODE} (${HOOK_OPT:-tidak ada})"
          if [ "$KSU_STEALTH" = "true" ]; then
            if ksu_has KSU_NOPRINTK; then
              scripts/config --file out/.config -e KSU_NOPRINTK -d KSU_DEBUG
              echo "::notice::KSU_STEALTH: KSU_NOPRINTK=y"
            else
              echo "::warning::KSU_NOPRINTK tidak ada di Kconfig xxKSU ${KSU_LABEL:-$KSU_REF}"
            fi
          fi

          # --- NoMount v2.2.0 (built-in) ---
          if [ "$NOMOUNT_ENABLE" = "true" ]; then
            scripts/config --file out/.config -e NOMOUNT
          fi

          # --- KSU_SUSFS_ENABLE_LOG WAJIB aktif ---
          # Bila dimatikan, susfs.h tidak mendefinisikan SUSFS_LOGI_RL (dipakai fs/susfs.c:98,175) sehingga kompilasi gagal:
          # "implicit declaration of function 'SUSFS_LOGI_RL'". Opsi ini tetap ada di SUSFS_OPTS (diaktifkan & diverifikasi).
          # KSU_STEALTH kini hanya membungkam printk KernelSU (KSU_NOPRINTK) di atas.
          # --- SUSFS (Jack) 10 opsi + fgetpriority (built-in) ---
          if [ "$SUSFS_ENABLE" = "true" ]; then
            for o in $SUSFS_OPTS; do scripts/config --file out/.config -e "$o"; done
            echo "::notice::SUSFS: ${SUSFS_OPTS// /, } diaktifkan"
          fi
          if [ "$FGP_ENABLE" = "true" ]; then
            scripts/config --file out/.config -e FGETPRIORITY
          fi

          # --- Memori / shrinker ---
          # Mode default (enable_memcg_psi=false) = Starlight: ANDROID_SIMPLE_LMK=y, MEMCG/PSI mati.
          # Kconfig: ANDROID_SIMPLE_LMK depends on !ANDROID_LOW_MEMORY_KILLER && !MEMCG && !PSI, jadi semua yang bentrok
          # dimatikan SEBELUM olddefconfig dan Simple LMK dinyalakan di putaran yang SAMA (olddefconfig membuang simbol
          # yang dependensinya belum terpenuhi saat itu, dan tidak menyalakannya lagi di putaran berikutnya).
          MEMCG_REQ=""
          if [ "$ENABLE_MEMCG_PSI" = "true" ]; then
            scripts/config --file out/.config -e CGROUPS -e MEMCG
            MEMCG_REQ="CONFIG_MEMCG"
            for sym in MEMCG_SWAP MEMCG_KMEM PSI; do
              if has_sym "$sym"; then
                scripts/config --file out/.config -e "$sym"; MEMCG_REQ="$MEMCG_REQ CONFIG_${sym}"
              else
                echo "::notice::${sym} tidak ada di Kconfig tree ini (dilewati)"
              fi
            done
            scripts/config --file out/.config -d ANDROID_SIMPLE_LMK
            echo "::notice::enable_memcg_psi aktif: ${MEMCG_REQ} (Simple LMK dimatikan karena bentrok)"
          else
            # Prasyarat sumber: driver Simple LMK harus benar-benar ada di tree (bukan hanya Kconfig-nya).
            has_sym ANDROID_SIMPLE_LMK \
              || { echo "::error::Simbol ANDROID_SIMPLE_LMK tidak ada di Kconfig tree ini; tree ini tidak membawa Simple LMK."; exit 1; }
            test -f drivers/android/simple_lmk.c \
              || { echo "::error::drivers/android/simple_lmk.c tidak ada di tree ini."; exit 1; }
            grep -q 'CONFIG_ANDROID_SIMPLE_LMK' drivers/android/Makefile \
              || { echo "::error::drivers/android/Makefile tidak membangun simple_lmk (CONFIG_ANDROID_SIMPLE_LMK)."; exit 1; }
            scripts/config --file out/.config \
              -d MEMCG -d MEMCG_SWAP -d MEMCG_SWAP_ENABLED -d MEMCG_KMEM \
              -d PSI -d PSI_DEFAULT_DISABLED -d ANDROID_LOW_MEMORY_KILLER \
              -e SWAP -e ANDROID -e STAGING -e ANDROID_SIMPLE_LMK
            echo "::notice::Mode Starlight: ANDROID_SIMPLE_LMK=y, MEMCG/PSI dimatikan"
          fi
          # --- Kernel panic: default tree -> nilai sysctl awal setelah boot (dibaca aplikasi LSpeed dll.) ---
          echo "== Opsi panic di defconfig tree (SEBELUM diubah workflow) =="
          grep -E '^(# )?CONFIG_(PANIC_ON_OOPS(_VALUE)?|PANIC_TIMEOUT|BOOTPARAM_SOFTLOCKUP_PANIC(_VALUE)?|BOOTPARAM_HUNG_TASK_PANIC(_VALUE)?|BOOTPARAM_HARDLOCKUP_PANIC(_VALUE)?|DEBUG_BUGVERBOSE)[= ]' out/.config || echo "(tidak ada)"
          if [ "${{ inputs.disable_kernel_panic }}" = "true" ]; then
            scripts/config --file out/.config \
              -d PANIC_ON_OOPS --set-val PANIC_ON_OOPS_VALUE 0 --set-val PANIC_TIMEOUT 0 \
              -d BOOTPARAM_SOFTLOCKUP_PANIC -d BOOTPARAM_HUNG_TASK_PANIC -d BOOTPARAM_HARDLOCKUP_PANIC
            echo "::notice::disable_kernel_panic aktif: panic_on_oops=0, panic=0, softlockup/hung-task/hardlockup panic=0 (nilai awal sysctl)"
          fi

          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee -a ../build.log

          echo "== Opsi panic di .config FINAL =="
          grep -E '^(# )?CONFIG_(PANIC_ON_OOPS(_VALUE)?|PANIC_TIMEOUT|BOOTPARAM_SOFTLOCKUP_PANIC|BOOTPARAM_HUNG_TASK_PANIC|BOOTPARAM_HARDLOCKUP_PANIC)[= ]' out/.config || true

          # Pastikan opsi benar-benar aktif (Kconfig membuang opsi yang tidak dikenal / dependensi tidak terpenuhi)
          MISSING=0
          REQ="CONFIG_KSU CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_SECURITY_SELINUX ${HOOK_OPT}"
          if [ "$SUSFS_ENABLE" = "true" ]; then for o in $SUSFS_OPTS; do REQ="$REQ CONFIG_${o}"; done; fi
          if [ "$FGP_ENABLE" = "true" ]; then REQ="$REQ CONFIG_FGETPRIORITY"; fi
          if [ "$ENABLE_MEMCG_PSI" = "true" ]; then REQ="$REQ $MEMCG_REQ"; else REQ="$REQ CONFIG_ANDROID_SIMPLE_LMK"; fi
          for opt in $REQ; do
            if grep -q "^${opt}=y" out/.config; then echo "OK      ${opt}=y"
            else echo "MISSING ${opt}"; MISSING=1; fi
          done
          if [ -z "$HOOK_OPT" ]; then echo "::error::Tidak ada mode hook xxKSU yang bisa diaktifkan"; MISSING=1; fi
          if [ "$ENABLE_MEMCG_PSI" != "true" ]; then
            # Mode Starlight: MEMCG/PSI/LMK lama HARUS mati (bila ada yang aktif lagi, mis. di-select simbol lain, build dihentikan)
            for bad in CONFIG_MEMCG CONFIG_PSI CONFIG_ANDROID_LOW_MEMORY_KILLER; do
              if grep -q "^${bad}=y" out/.config; then
                echo "::error::${bad}=y masih aktif padahal mode Starlight (Simple LMK)"; MISSING=1
              else
                echo "OK      ${bad} mati"
              fi
            done
            if ! grep -q '^CONFIG_ANDROID_SIMPLE_LMK=y' out/.config; then
              echo "== Diagnosis ANDROID_SIMPLE_LMK =="
              KF="$(git grep -lE '^config[[:space:]]+ANDROID_SIMPLE_LMK[[:space:]]*$' -- 'Kconfig*' '*/Kconfig*' | sed -n '1p')"
              grep -n -A14 -E '^config[[:space:]]+ANDROID_SIMPLE_LMK[[:space:]]*$' "$KF" || true
              grep -E '^(# )?CONFIG_(ANDROID_SIMPLE_LMK|ANDROID_LOW_MEMORY_KILLER|ANDROID|STAGING|ANDROID_BINDER_IPC|SWAP|MEMCG|PSI)[= ]' out/.config || true
            fi
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "== Diagnosis: KSU / hook di out/.config =="
            grep -E '^(# )?CONFIG_(KSU|KALLSYMS|KPROBES|MODULES|NOMOUNT|FGETPRIORITY|THREAD_INFO_IN_TASK|SECURITY_SELINUX)[A-Z0-9_]*[= ]' out/.config || true
            echo "== Kconfig xxKSU (cek 'depends on') =="
            sed -n '1,120p' drivers/kernelsu/Kconfig || true
            echo "::error::Ada opsi xxKSU yang tidak aktif (lihat daftar MISSING di atas)."
            exit 1
          fi
          grep -E '^CONFIG_KSU' out/.config || true
          if [ "$NOMOUNT_ENABLE" = "true" ]; then
            grep -q '^CONFIG_NOMOUNT=y' out/.config \
              || { echo "::error::CONFIG_NOMOUNT tidak aktif di out/.config"; grep -E '^(# )?CONFIG_(NOMOUNT|KEYS)' out/.config || true; cat fs/nomount/Kconfig || true; exit 1; }
            echo "OK      CONFIG_NOMOUNT=y"
          fi
          echo "== Opsi MEMCG / PSI / shrinker / LTO di build ini =="
          grep -E '^(# )?CONFIG_(MEMCG[A-Z_]*|PSI|ANDROID_SIMPLE_LMK|ANDROID_LOW_MEMORY_KILLER|MODULES|KPROBES|FTRACE|TRACEPOINTS)[= ]' out/.config || true

          if [ "$OFFICIAL_OPTS" = "true" ]; then
            echo "== Opsi build resmi (LTO/Polly) di out/.config =="
            grep -E '^(# )?CONFIG_(LTO|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|LTO_NONE|THINLTO|POLLY_CLANG)[= ]' out/.config || true
          fi

          # --- Verifikasi LTO + fallback otomatis: full -> thin -> tanpa LTO ---
          LTO_FINAL="none"
          if [ "$OFFICIAL_OPTS" = "true" ] && [ "$LTO_MODE" != "none" ]; then
            GOT="$(lto_state)"
            if [ "$GOT" != "$LTO_MODE" ]; then
              echo "::notice::LTO '${LTO_MODE}' ditolak Kconfig setelah olddefconfig (hasil: ${GOT}). Diagnosis di bawah."
              lto_diag
              if [ "$LTO_MODE" = "full" ] && lto_enable thin; then
                echo "Mencoba ThinLTO sebagai cadangan..."
                make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee -a ../build.log
                GOT="$(lto_state)"
              fi
            fi
            case "$GOT" in
              "$LTO_MODE") echo "::notice::LTO aktif: ${GOT}" ;;
              none)        echo "::warning::LTO tidak bisa diaktifkan (lihat blok 'Diagnosis LTO' di atas): build berjalan TANPA LTO" ;;
              *)           echo "::notice::LTO '${LTO_MODE}' tidak didukung, memakai cadangan: ${GOT}" ;;
            esac
            LTO_FINAL="$GOT"
          fi
          echo "LTO_FINAL=${LTO_FINAL}" >> "$GITHUB_ENV"
          {
            echo "### Ringkasan konfigurasi"
            echo "- Upstream CIP: merge \`${CIP_MERGED:-tidak}\` (\`${CIP_BRANCH}\`${CIP_COMMIT:+ @ \`${CIP_COMMIT:0:8}\`})"
            echo "- xxKSU: \`${KSU_LABEL:-$KSU_REF}\` (commit \`${KSU_COMMIT:0:8}\`), SELinux: \`${KSU_SEL_NOTE}\`, hook: \`${KSU_HOOK_MODE}\`, versi driver: \`${KSU_DRV_VERSION}\` (manager versionCode \`${KSU_MGR_CODE}\`)"
            echo "- NoMount: \`${NOMOUNT_ENABLE}\` (\`${NOMOUNT_TAG}\`)"
            echo "- SUSFS: \`${SUSFS_ENABLE}\` (\`${SUSFS_VER:-tidak}\`, sisi-KernelSU: \`${SUSFS_GLUE:-tidak}\`), fgetpriority: \`${FGP_ENABLE}\` (\`${FGP_COMMIT:0:8}\`)"
            echo "- LTO akhir: \`${LTO_FINAL}\`, MEMCG: \`$(grep -q '^CONFIG_MEMCG=y' out/.config && echo aktif || echo mati)\`, PSI: \`$(grep -q '^CONFIG_PSI=y' out/.config && echo aktif || echo mati)\`, Simple LMK: \`$(grep -q '^CONFIG_ANDROID_SIMPLE_LMK=y' out/.config && echo aktif || echo mati)\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # -k: lanjutkan kompilasi walau ada error, supaya SEMUA error muncul sekaligus dalam satu run.
          if ! make -k -j"$(nproc)" "${MAKE_ARGS[@]}" 2>&1 | tee -a ../build.log; then
            echo "== Ringkasan semua error compile =="
            grep -E 'error:|\*\*\* \[' ../build.log | grep -v '::error' | sort -u | head -80 || true
            echo "::error::Kompilasi kernel gagal (lihat ringkasan error di atas)."
            exit 1
          fi

          echo "== Info xxKSU di build ini =="
          grep -E '^-- (KernelSU|KSU)' ../build.log | sort -u || true
          KREL="$(cat out/include/config/kernel.release)"
          echo "== Versi kernel (uname -r): ${KREL} =="
          case "$KREL" in
            *"${KERNEL_LOCALVERSION}") echo "::notice::Nama kernel terpasang: ${KREL}" ;;
            *) echo "::error::kernel.release '${KREL}' tidak berakhiran '${KERNEL_LOCALVERSION}'"; exit 1 ;;
          esac
          ls -lh out/arch/arm64/boot/ || true

      - name: Diagnosis xxKSU (informasi, tidak menggagalkan build)
        working-directory: kernel
        run: |
          set +e
          echo "== Driver xxKSU ikut ter-link? (jumlah simbol ksu_ di System.map) =="
          grep -cE ' [a-zA-Z] ksu_' out/System.map
          grep -E ' [a-zA-Z] (kernelsu_init|ksu_handle_[a-z_]+)$' out/System.map | head -12
          echo "== Config terkait =="
          grep -E '^(# )?CONFIG_(KSU|KALLSYMS|KALLSYMS_ALL|SECCOMP|SECURITY_SELINUX|MEMCG|PSI|ANDROID_SIMPLE_LMK|LTO_CLANG_FULL|LTO_CLANG_THIN|FGETPRIORITY)[A-Z_]*[= ]' out/.config
          echo "== SUSFS / fgetpriority ikut ter-link? =="
          echo "simbol susfs_: $(grep -cE ' [a-zA-Z] susfs_' out/System.map)"
          grep -E 'susfs_init|gphook_find_user|fgetpriority_init' out/System.map | head -6
          echo "== Waktu build kernel (cocokkan dengan uname -v di HP untuk memastikan zip yang benar ter-flash) =="
          strings out/arch/arm64/boot/Image* 2>/dev/null | grep -m1 'Linux version'

      - name: Siapkan AnyKernel3
        run: |
          BOOT=kernel/out/arch/arm64/boot
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          echo "::notice::AnyKernel3 commit $(git -C ak3 rev-parse HEAD) (catat bila perlu mengunci versi)"
          rm -rf ak3/.git ak3/.github ak3/README.md

          # --- Tambalan AnyKernel3: bug status keluar di split_boot() (ak3-core.sh) ---
          # Di AK3 master, baris `[ $? == 1 ] && splitfail=1;` membuat `$?` bernilai 1 walau magiskboot SUKSES, sehingga
          # `if [ $? != 0 -o "$splitfail" ]` sesudahnya selalu abort: "Splitting image failed. Aborting..." (flash gagal di
          # recovery pada boot.img apa pun, bukan salah ponsel/kernel). Diganti `case`, yang berstatus 0 bila tidak cocok.
          CORE=ak3/tools/ak3-core.sh
          if grep -qE '^[[:space:]]*\[ \$\? == 1 \] && splitfail=1;' "$CORE"; then
            sed -i -E 's/^([[:space:]]*)\[ \$\? == 1 \] && splitfail=1;/\1case $? in 1) splitfail=1;; esac;/' "$CORE"
            grep -q 'case \$? in 1) splitfail=1;; esac;' "$CORE" \
              || { echo "::error::Tambalan ak3-core.sh (split_boot) gagal diterapkan"; exit 1; }
            echo "::notice::ak3-core.sh ditambal: bug status keluar split_boot"
          fi
          # Uji: split_boot() asli + magiskboot palsu. Exit 0 (sukses) TIDAK boleh abort; exit 1 (gagal) harus abort.
          T="$(mktemp -d)"; mkdir -p "$T/tools"
          awk '/^split_boot\(\) \{/{f=1} f{print} f&&/^}/{exit}' "$CORE" > "$T/split_fn.sh"
          if [ ! -s "$T/split_fn.sh" ]; then
            echo "::warning::split_boot() tidak ditemukan di ak3-core.sh (struktur AnyKernel3 berubah); uji split_boot dilewati"
          else
            head -c 4096 /dev/zero > "$T/block.img"
            printf '#!/bin/sh\nexit ${FAKE_RC:-0}\n' > "$T/tools/magiskboot"; chmod +x "$T/tools/magiskboot"
            cat > "$T/harness.sh" <<'HARNESS'
          abort(){ ABORTED=1; }
          AKHOME=$T; BIN=$T/tools; BOOTIMG=$T/boot.img; SPLITIMG=$T/split_img; BLOCK=$T/block.img; PATH=$BIN:$PATH
          . $T/split_fn.sh
          ABORTED=0; split_boot >/dev/null 2>&1; echo $ABORTED
          HARNESS
            for rc in 0 1; do
              GOT="$(FAKE_RC=$rc T="$T" bash "$T/harness.sh" | tail -1)"; rm -rf "$T/split_img" "$T/boot.img"
              [ "$rc" = 0 ] && WANT=0 || WANT=1
              echo "uji split_boot: magiskboot exit ${rc} -> abort=${GOT} (harus ${WANT})"
              [ "$GOT" = "$WANT" ] || { echo "::error::split_boot() salah menangani exit ${rc}; zip hasilnya tidak akan bisa diflash"; exit 1; }
            done
          fi
          rm -rf "$T"

          # Pakai Image.gz-dtb jika ada, kalau tidak gabungkan Image.gz + dtb
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            cp "$BOOT/Image.gz-dtb" ak3/Image.gz-dtb
          elif [ -f "$BOOT/Image.gz" ]; then
            DTBS=$(find kernel/out/arch/arm64/boot/dts -name '*whyred*.dtb' | sort)
            [ -n "$DTBS" ] || { echo "DTB whyred tidak ditemukan"; exit 1; }
            cat "$BOOT/Image.gz" $DTBS > ak3/Image.gz-dtb
          else
            echo "Kernel image tidak ditemukan"; exit 1
          fi

          # Konfigurasi anykernel.sh untuk Redmi Note 5 Pro (whyred)
          sed -i \
            -e "s|^kernel.string=.*|kernel.string=${{ inputs.kernel_name }} by ${{ github.actor }}|" \
            -e "s|^do.devicecheck=.*|do.devicecheck=1|" \
            -e "s|^do.modules=.*|do.modules=0|" \
            -e "s|^do.cleanup=.*|do.cleanup=1|" \
            -e "s|^device.name1=.*|device.name1=whyred|" \
            -e "s|^device.name2=.*|device.name2=Redmi Note 5 Pro|" \
            -e "s|^device.name3=.*|device.name3=|" \
            -e "s|^device.name4=.*|device.name4=|" \
            -e "s|^device.name5=.*|device.name5=|" \
            -e "s|^block=.*|block=/dev/block/bootdevice/by-name/boot;|" \
            -e "s|^is_slot_device=.*|is_slot_device=0;|" \
            -e "s|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|" \
            -e "s|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|" \
            ak3/anykernel.sh
          # AnyKernel3 baru memakai BLOCK/IS_SLOT_DEVICE (huruf besar), versi lama huruf kecil: pastikan salah satunya terpasang
          grep -Eiq '^block=/dev/block/bootdevice/by-name/boot;' ak3/anykernel.sh \
            || { echo "::error::block boot whyred gagal diset di anykernel.sh"; grep -in 'block' ak3/anykernel.sh; exit 1; }
          grep -Eiq '^is_slot_device=0;' ak3/anykernel.sh \
            || { echo "::error::is_slot_device gagal diset di anykernel.sh"; exit 1; }
          grep -Ein '^(block|is_slot_device)=' ak3/anykernel.sh
          # Hapus contoh edit ramdisk bawaan AnyKernel3
          sed -i '/# begin ramdisk changes/,/# end ramdisk changes/{//!d}' ak3/anykernel.sh
          # AK3 baru: contoh edit ramdisk (init.tuna.rc, fstab.tuna, dll) ada di antara dump_boot dan write_boot, tanpa penanda begin/end.
          sed -i '/^dump_boot;/,/^write_boot;/{/^dump_boot;/b;/^write_boot;/b;d}' ak3/anykernel.sh
          if grep -Eq 'tuna|cpuctl' ak3/anykernel.sh; then echo "::error::contoh edit ramdisk AnyKernel3 masih ada"; grep -En 'tuna|cpuctl' ak3/anykernel.sh; exit 1; fi

      - name: Buat zip
        id: pack
        run: |
          VER=$(make -s -C kernel O=out ARCH=arm64 kernelversion 2>/dev/null || echo 4.19)
          # cipNNN dan stNN dibaca dari uname -r hasil build (mis. 4.19.325-cip137-st21-kaizen)
          KREL="$(cat kernel/out/include/config/kernel.release 2>/dev/null || true)"
          CIPV="$(echo "$KREL" | grep -oE -- '-cip[0-9]+' | head -1 | tr -d '-' || true)"
          STV="$(echo "$KREL" | grep -oE -- '-st[0-9]+' | head -1 | tr -d '-' || true)"
          [ -n "$STV" ] || STV="st${ST_VERSION}"
          echo "Versi di nama zip: ${CIPV:-tanpa-cip} ${STV} (uname -r: ${KREL})"
          ZIP="${{ inputs.kernel_name }}-${VER}${CIPV:+-$CIPV}-${STV}-whyred-xxKSU-${KSU_LABEL:-$KSU_REF}$([ "$NOMOUNT_ENABLE" = true ] && echo -NoMount)$([ "$SUSFS_ENABLE" = true ] && echo "-SUSFS-${SUSFS_VER:-}")$([ "$FGP_ENABLE" = true ] && echo -fgp)-LTO-${LTO_FINAL:-none}-$(date +%Y%m%d-%H%M).zip"
          (cd ak3 && zip -r9 "../$ZIP" . -x '*.git*')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          sha256sum "$ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: ${{ steps.pack.outputs.zip }}

      - name: Upload .config hasil build (untuk dibandingkan dengan kernel lain)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kernel-config
          if-no-files-found: ignore
          include-hidden-files: true
          path: kernel/out/.config

      - name: Upload log build jika gagal
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: |
            build.log
            kernel/out/.config
            kernel/KernelSU/kernel/Kconfig
            kernel/KernelSU/kernel/Kbuild
            kernel/NoMount/kernel/src/Kconfig
            kernel/fs/Kconfig.susfs
            kernel/**/*.rej
          include-hidden-files: true

      - name: Upload ke GitHub Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="whyred-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "${{ steps.pack.outputs.zip }}" \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.kernel_name }} $TAG" \
            --notes "Versi source: st${ST_VERSION}. Maya Kernel cherry-pick: ${MAYA_MERGE}. LTO: ${LTO_FINAL:-none}. Kernel whyred dari ${{ inputs.kernel_repo }} (${{ inputs.kernel_branch }}) + upstream CIP merge: ${CIP_MERGED:-tidak} ${CIP_COMMIT:+@ ${CIP_COMMIT:0:8}} + xxKSU ${KSU_LABEL:-$KSU_REF} @ ${KSU_COMMIT:0:8} (SELinux: ${KSU_SEL_NOTE}, hook: ${KSU_HOOK_MODE}) + NoMount: ${NOMOUNT_ENABLE} (${NOMOUNT_TAG}, built-in) + SUSFS: ${SUSFS_ENABLE} (${SUSFS_VER:-tidak}, sisi-KernelSU: ${SUSFS_GLUE:-tidak}) + fgetpriority: ${FGP_ENABLE} (${FGP_COMMIT:0:8}, built-in). Versi driver ${KSU_DRV_VERSION} = manager versionCode ${KSU_MGR_CODE}. Manager: APK dari rilis xxKSU ${KSU_LABEL} (https://github.com/backslashxx/KernelSU/releases/tag/${KSU_LABEL}); tanda tangan dummy.keystore diterima driver."
