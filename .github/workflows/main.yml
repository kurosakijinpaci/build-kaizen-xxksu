name: Whyred Kernel 4.19 - xxKSU + NoMount + CIP

# Simpan file ini di: .github/workflows/xxksu.yml
# Jalankan dari tab Actions -> "Whyred Kernel 4.19 - xxKSU + NoMount + CIP" -> Run workflow
#
# Metode root : xxKSU (backslashxx/KernelSU) = fork KernelSU dengan driver "upstream compliant" untuk Linux 3.0 ~ 5.4+.
#               Built-in (CONFIG_KSU=y). Hook dipasang DRIVER sendiri: ARM64 branch-link hijack (default, disarankan 4.19+)
#               atau syscall table (input ksu_hook_mode) + LSM hook. Tidak ada patch hook di sumber kernel.
# SUSFS       : v2.4.0 dari JackA1ltman/NonGKI_Kernel_Build_2nd (patch kernel-side 4.19, file patches/susfs_patch_to_4.19.patch di repo ini;
#               SUDAH di-rebase ke tree ini sesudah merge CIP+Maya: git apply bersih, tanpa offset/fuzz, 10/10 hunk namespace.c,
#               termasuk hunk vfs_create_mount() dan include susfs_def.h di fs/stat.c. Patch Jack asli dibuat untuk 4.19 polos tanpa
#               fs_context sehingga 7 berkas (fs/Makefile, namespace.c, cmdline.c, task_mmu.c, super.c, kernel/sys.c, mm/memory.c)
#               konteksnya tidak cocok: itu penyebab banyak hunk, BUKAN merge Maya/CIP)
#               + 10 opsi CONFIG_KSU_SUSFS_* diaktifkan (input enable_susfs). Sisi KernelSU = patches/10_enable_susfs_for_ksu.patch.
#               PERINGATAN: patch sisi-KernelSU itu dibuat untuk KernelSU tiann/OriginSU (Kbuild multi-berkas). xxKSU di-build sebagai
#               SATU unit (ksu.o), jadi patch itu kemungkinan besar TIDAK cocok. Langkah "Pasang sisi KernelSU untuk SUSFS" memeriksanya
#               di awal (sebelum build 30 menit) dan berhenti dengan penjelasan, kecuali input susfs_require_ksu_glue dimatikan
#               (SUSFS ikut terkompilasi tetapi TIDAK aktif/tidak bisa dikontrol dari userspace).
# fgetpriority: modul uid-filter aerath-stuff/fgetpriority, di-compile BUILT-IN (drivers/fgetpriority, bool), input enable_fgetpriority.
#               SELinux: kernel/selinux diambil dari ujung master (input ksu_selinux_master, default aktif); sisa driver tetap di tag.
#               Bila master identik dengan tag, tidak ada yang berubah (dicatat di log).
#               MANAGER: pakai APK manager dari rilis xxKSU yang SAMA dengan ksu_ref (tag v3.3.1-55), atau bangun dari zip sumber yang sama.
#               Manager buatan repo ini ditandatangani manager/dummy.keystore (kunci PUBLIK, sertifikat 0x363 / 4359c171...); driver
#               sudah menerimanya (apk_sign.c). Driver juga menerima kunci KernelSU resmi, KOWX712, dan midori01.
#               Kecocokan driver<->manager: UAPI harus sama (6 = 6, dicek di log) dan versi driver >= MINIMAL_SUPPORTED_KERNEL manager.
#               Input ksu_sync_version menyamakan angka versi driver dengan versionCode manager (30000 + jumlah commit - offset; offset dibaca otomatis dari manager/build.gradle.kts; v3.3.1-51 = 92, untuk v3.3.1-55 dibaca otomatis).
# NoMount     : v2.3.1 (maxsteeel/nomount) built-in (CONFIG_NOMOUNT=y) lewat setup.sh resmi dari tag. Modul metamodule di perangkat
#               harus ikut v2.3.1 (driver dan modul dirilis berpasangan).
# Kernel base : source tree di-merge dengan upstream CIP (linux-4.19.y-cip) SEBELUM patch lain (input merge_cip, default aktif),
#               lalu bump localversion-st dan cherry-pick 3 commit Maya Kernel.
# Toolchain   : AOSP Clang r547379 (clang 20.0.0). LTO mengikuti input lto_mode (default full, fallback otomatis).
# Tree source TIDAK boleh membawa root/SUSFS bawaan: workflow berhenti jika terdeteksi.

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "Tag ATAU hash commit xxKSU (backslashxx/KernelSU). Default v3.3.1-55."
        default: "v3.3.1-55"
        required: true
        type: string
      ksu_selinux_master:
        description: "Ambil folder kernel/selinux dari ujung master xxKSU (commit SELinux terbaru sesudah tag). Sisa driver tetap di tag. Matikan bila kompilasi gagal karena file SELinux master butuh perubahan lain di luar folder itu."
        type: boolean
        default: true
      ksu_sync_version:
        description: "Samakan angka versi driver (KSU_VERSION) dengan versionCode manager dari tag yang sama (30000 + jumlah commit git - offset, offset dibaca dari build.gradle.kts sumber). Matikan untuk memakai angka bawaan Makefile (bisa tertinggal dari versionCode manager)."
        type: boolean
        default: true
      ksu_hook_mode:
        description: "Cara hook xxKSU. branch_link = ARM64 branch-link hijack (default, disarankan untuk 4.19+; bila gagal pada satu simbol, otomatis jatuh ke syscall table untuk simbol itu). syscall_table = tamper sys_call_table (disarankan untuk 3.0 ~ 4.14)."
        type: choice
        options: [branch_link, syscall_table]
        default: branch_link
      kernel_repo:
        description: "Repo source kernel"
        default: "https://github.com/user-why-red/android_kernel_xiaomi_sdm660_419"
        required: true
      merge_cip:
        description: "Merge upstream CIP (linux-4.19.y-cip: 4.19.325 + backport keamanan CIP) ke tree sebelum patch lain. Konflik diselesaikan dengan versi tree. Butuh riwayat git upstream di tree; bila tidak ada, build berhenti dengan pesan jelas (matikan input ini untuk melewati)."
        type: boolean
        default: true
      cip_commit:
        description: "Kunci commit CIP (hash). Kosong = ujung terbaru linux-4.19.y-cip setiap kali build dijalankan (default, selalu commit terbaru). Isi hash untuk build yang bisa diulang persis sama."
        default: ""
        type: string
      st_version:
        description: "Nomor versi source kernel (file localversion-st). KOSONG (default) = ikut nilai dari source asli (user-why-red) apa adanya, jadi selalu mengikuti commit terbaru mereka. Isi angka (mis. 21 = -st21) hanya untuk menimpa."
        default: ""
        required: false
        type: string
      merge_maya:
        description: "Cherry-pick 3 commit Maya Kernel (anythinganywantanywere/android_kernel_xiaomi_sdm660_419: 93669a2, 7058745, 76f94db) ke tree, sesudah merge CIP. Konflik = build berhenti dengan daftar file konflik."
        type: boolean
        default: true
      kernel_branch:
        description: "Branch source kernel. Default 'back' = branch dengan dukungan dynamic/retrofit partition (harus bersih dari root/SUSFS bawaan)"
        default: "back"
        required: true
      defconfig:
        description: "Defconfig"
        default: "vendor/whyred-perf_defconfig"
        required: true
      kernel_name:
        description: "Suffix nama kernel. Ditambahkan ke CONFIG_LOCALVERSION defconfig (mis. -San-Kernel-Revenant-R1.1.108-xKaizen), juga dipakai untuk nama zip & AnyKernel."
        default: "xKaizen"
        required: true
      enable_nomount:
        description: "Pasang NoMount v2.3.1 (built-in). Matikan untuk build pembanding tanpa NoMount."
        type: boolean
        default: true
      enable_susfs:
        description: "Integrasikan SUSFS Jack v2.4.0 (patch kernel-side, tertanam di workflow ini) dan aktifkan 10 opsi CONFIG_KSU_SUSFS_*."
        type: boolean
        default: true
      susfs_kernel_patch:
        description: "Path patch SUSFS kernel-side 4.19 (Jack), tertanam di workflow ini."
        default: "patches/susfs_patch_to_4.19.patch"
        type: string
      susfs_ksu_patch:
        description: "Path patch sisi-KernelSU (10_enable_susfs_for_ksu.patch) di repo workflow ini."
        default: "patches/10_enable_susfs_for_ksu.patch"
        type: string
      susfs_require_ksu_glue:
        description: "Hentikan build bila sisi-KernelSU SUSFS tidak bisa dipasang ke xxKSU (disarankan, gagal cepat di awal). Matikan hanya untuk uji: SUSFS ikut terkompilasi tetapi TIDAK aktif."
        type: boolean
        default: true
      enable_fgetpriority:
        description: "Pasang fgetpriority (aerath-stuff) built-in: sembunyikan hasil getpriority/setpriority/ioprio antar-aplikasi."
        type: boolean
        default: true
      fgetpriority_ref:
        description: "Commit/tag aerath-stuff/fgetpriority. Default = commit be4ea47 (v0.0.4). Kosong = ujung branch default (terbaru)."
        default: "be4ea47fa651c80a068e477d5a3627270b7bd683"
        type: string
      lto_mode:
        description: "Mode LTO. full (default, resep tree: Full LTO + Polly; jika ditolak Kconfig otomatis coba ThinLTO lalu tanpa LTO + diagnosis di log). thin = ThinLTO. none = tanpa LTO."
        type: choice
        options: [full, thin, none]
        default: full
      enable_memcg_psi:
        description: "Default MATI = persis Starlight: Android Simple LMK aktif, MEMCG + PSI mati (keduanya bentrok di Kconfig, tidak bisa aktif bersamaan). Nyalakan hanya jika ingin MEMCG + PSI (Simple LMK otomatis mati)."
        type: boolean
        default: false
      disable_kernel_panic:
        description: "Matikan panic otomatis bawaan kernel (PANIC_ON_OOPS, PANIC_TIMEOUT, softlockup/hung-task/hardlockup panic). Dengan ini aplikasi tweak (mis. LSpeed > Kernel panic) tidak lagi membaca kernel sebagai 'panic menyala' setelah reboot. Matikan input ini bila ingin kernel tetap panic/reboot sendiri saat oops (untuk debug, ramoops)."
        type: boolean
        default: false
      release:
        description: "Upload zip ke GitHub Release?"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: Asia/Jakarta
  ARCH: arm64
  SUBARCH: arm64

  # Nama kernel (uname -r) = CONFIG_LOCALVERSION defconfig + "-<kernel_name>"; nilai akhir dihitung di langkah build
  # dan ditulis ke GITHUB_ENV (contoh: -San-Kernel-Revenant-R1.1.108-xKaizen). Nilai awal ini hanya cadangan.
  KERNEL_LOCALVERSION: "-${{ inputs.kernel_name }}"

  # --- Toolchain: sama dengan kernel Starlight (AOSP Clang r547379 = clang 20.0.0) ---
  # CLANG_REV      : nama folder prebuilt di repo prebuilts/clang/host/linux-x86.
  # CLANG_BRANCHES : branch yang dicoba berurutan sampai folder CLANG_REV ditemukan.
  CLANG_REV: "clang-r547379"
  CLANG_BRANCHES: "android16-release main"

  # --- LTO + Polly (Polly hanya aktif bila toolchain mendukung) ---
  # Hanya diaktifkan bila simbol Kconfig / flag compiler-nya didukung tree & toolchain; sisanya dilewati dengan peringatan di log.
  OFFICIAL_OPTS: "true"
  LTO_MODE: ${{ inputs.lto_mode || 'full' }}

  # --- xxKSU (backslashxx/KernelSU), dipasang dengan clone + checkout tag ---
  KSU_REPO: https://github.com/backslashxx/KernelSU
  KSU_REF: ${{ inputs.ksu_ref || 'v3.3.1-55' }}
  KSU_SELINUX_MASTER: ${{ inputs.ksu_selinux_master == false && 'false' || 'true' }}
  KSU_HOOK_MODE: ${{ inputs.ksu_hook_mode || 'branch_link' }}
  KSU_SYNC_VERSION: ${{ inputs.ksu_sync_version == false && 'false' || 'true' }}
  ENABLE_MEMCG_PSI: ${{ inputs.enable_memcg_psi == true && 'true' || 'false' }}

  # --- Upstream CIP (merge ke tree sebelum patch lain) ---
  CIP_MERGE: ${{ inputs.merge_cip == false && 'false' || 'true' }}
  CIP_REPO: https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git
  # Mirror resmi CIP (GitLab), dicoba bila git.kernel.org tidak terjangkau dari runner (pisahkan dengan spasi bila lebih dari satu).
  CIP_REPO_MIRRORS: "https://gitlab.com/cip-project/cip-kernel/linux-cip.git"
  CIP_BRANCH: linux-4.19.y-cip
  # Kosong = ujung branch terbaru. Isi (input cip_commit) = kunci ke hash tertentu.
  CIP_PIN: ${{ inputs.cip_commit }}
  # Area yang dikustomisasi vendor/Starlight: SETELAH merge dikembalikan ke versi tree. Perubahan CIP di sini ditulis untuk kode
  # upstream polos dan tidak cocok dengan kode tree (terbukti: schedutil up/down_rate_limit_us, glink chinfo, mbcache e_flags).
  CIP_KEEP_TREE: "kernel/sched drivers/rpmsg include/linux/rpmsg.h include/linux/rpmsg fs/mbcache.c include/linux/mbcache.h fs/ext4/xattr.c fs/ext4/xattr.h fs/ext2/xattr.c drivers/soc/qcom drivers/staging drivers/gpu/msm drivers/media/platform/msm techpack arch/arm64/boot/dts arch/arm64/configs"

  # --- Versi source kernel (localversion-st) ---
  # Kosong = ikut localversion-st dari source asli (dibaca di langkah bump)
  ST_VERSION: ${{ inputs.st_version }}

  # --- Commit Maya Kernel (di-cherry-pick sesudah merge CIP; urutan otomatis menurut tanggal commit) ---
  MAYA_MERGE: ${{ inputs.merge_maya == false && 'false' || 'true' }}
  MAYA_REPO: https://github.com/anythinganywantanywere/android_kernel_xiaomi_sdm660_419
  MAYA_COMMITS: "93669a2a3dedcc238eae8085b90bddcd470e43c2 7058745cc9e1fa8b4f7d5afce748bda2c10c006e 76f94db92c4d0bd067934fa5c252049b14d9f324"

  # --- NoMount (built-in, di-pin ke tag rilis v2.3.1) ---
  NOMOUNT_TAG: v2.3.1
  NOMOUNT_ENABLE: ${{ inputs.enable_nomount == false && 'false' || 'true' }}

  # --- SUSFS (Jack v2.4.0, kernel-side) + 10 opsi; sisi-KernelSU lewat patch 10_enable ---
  SUSFS_ENABLE: ${{ inputs.enable_susfs == false && 'false' || 'true' }}
  SUSFS_KERNEL_PATCH: ${{ inputs.susfs_kernel_patch || 'patches/susfs_patch_to_4.19.patch' }}
  SUSFS_KSU_PATCH: ${{ inputs.susfs_ksu_patch || 'patches/10_enable_susfs_for_ksu.patch' }}
  # Mode senyap: printk KernelSU dibungkam (KSU_NOPRINTK). 'false' untuk debug.
  # CATATAN: KSU_SUSFS_ENABLE_LOG sekarang SELALU aktif (SUSFS Jack v2.4.0 butuh makro SUSFS_LOGI_RL dari opsi itu;
  # tanpa log, fs/susfs.c gagal dikompilasi). Tidak mengubah fungsi hide SELinux.
  KSU_STEALTH: "true"
  SUSFS_REQUIRE_GLUE: ${{ inputs.susfs_require_ksu_glue == false && 'false' || 'true' }}
  SUSFS_OPTS: "KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP KSU_SUSFS_PRIORITY_UID_FILTER"

  # --- fgetpriority (aerath-stuff), built-in ---
  FGP_ENABLE: ${{ inputs.enable_fgetpriority == false && 'false' || 'true' }}
  FGP_REPO: https://github.com/aerath-stuff/fgetpriority
  FGP_REF: ${{ inputs.fgetpriority_ref }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Bebaskan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev ccache zip unzip \
            lz4 cpio xz-utils python3 curl git lld \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone source kernel
        run: |
          set -eo pipefail
          # Ulangi clone bila koneksi terputus (mis. "early EOF" / "invalid index-pack output")
          ok=0
          for n in 1 2 3 4 5; do
            rm -rf kernel
            if git -c http.postBuffer=524288000 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=120 \
                 clone --depth 1 -b "${{ inputs.kernel_branch }}" "${{ inputs.kernel_repo }}" kernel; then
              ok=1; break
            fi
            echo "::warning::clone percobaan $n/5 gagal"; sleep $((n*15))
          done
          [ "$ok" = 1 ] || { echo "::error::clone ${{ inputs.kernel_repo }} gagal setelah 5 percobaan"; exit 1; }
          git -C kernel log -1 --format='Source: %h %s'
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' kernel/Makefile
          test -f "kernel/arch/arm64/configs/${{ inputs.defconfig }}"

      - name: Integrasikan upstream CIP (linux-4.19.y-cip)
        if: ${{ env.CIP_MERGE == 'true' }}
        working-directory: kernel
        run: |
          set -eo pipefail
          git config user.name "ci"; git config user.email "ci@local"
          echo "== Sebelum merge =="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) ' Makefile
          git log -1 --format='Tree: %h %s (%cd)'
          # Ulangi perintah jaringan yang gagal (git.kernel.org kadang timeout dari runner GitHub)
          retry() { local n; for n in 1 2 3 4 5; do "$@" && return 0; echo "::warning::percobaan $n/5 gagal: $*"; sleep $((n*20)); done; return 1; }
          # Clone dangkal tidak punya merge-base; ambil riwayat penuh (hanya mengunduh yang belum ada).
          if [ -f .git/shallow ]; then
            echo "Clone dangkal -> ambil riwayat penuh"
            retry git fetch -q --unshallow origin
          fi
          # git.kernel.org kadang tidak bisa dijangkau dari runner GitHub ("Failed to connect ... Connection timed out").
          # Coba alamat utama lalu mirror bergantian. Tiap alamat dites dulu dengan ls-remote (maks 45 detik) supaya satu
          # alamat yang mati tidak menghabiskan belasan menit seperti sebelumnya (5 x ~135 detik + jeda).
          CIP_OK=""
          for round in 1 2 3; do
            for U in "$CIP_REPO" $CIP_REPO_MIRRORS; do
              echo "== CIP: coba $U (putaran $round/3) =="
              if ! timeout 45 git ls-remote --exit-code --heads "$U" "refs/heads/${CIP_BRANCH}" >/dev/null 2>&1; then
                echo "::warning::CIP tidak terjangkau / branch ${CIP_BRANCH} tidak ada di: $U"; continue
              fi
              git remote remove cip 2>/dev/null || true
              git remote add cip "$U"
              if timeout 1500 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=90 fetch -q --no-tags cip "+refs/heads/${CIP_BRANCH}:refs/remotes/cip/${CIP_BRANCH}"; then
                CIP_OK="$U"; break 2
              fi
              echo "::warning::fetch CIP dari $U gagal"
            done
            [ "$round" -lt 3 ] && sleep $((round*20))
          done
          [ -n "$CIP_OK" ] \
            || { echo "::error::CIP tidak bisa diambil dari git.kernel.org maupun mirror (${CIP_REPO_MIRRORS}) setelah 3 putaran. Jalankan ulang workflow nanti, atau matikan input merge_cip."; exit 1; }
          echo "::notice::CIP diambil dari: $CIP_OK"
          CIP_REF="refs/remotes/cip/${CIP_BRANCH}"
          if [ -n "${CIP_PIN}" ]; then
            git rev-parse -q --verify "${CIP_PIN}^{commit}" >/dev/null \
              || { echo "::error::cip_commit '${CIP_PIN}' tidak ditemukan di ${CIP_BRANCH}"; exit 1; }
            CIP_REF="$(git rev-parse "${CIP_PIN}^{commit}")"
            echo "::notice::CIP dikunci ke ${CIP_REF:0:8} (bukan ujung branch)"
          fi
          git log -1 --format='CIP:  %h %s (%cd)' "$CIP_REF"
          echo "CIP_COMMIT=$(git rev-parse "$CIP_REF")" >> "$GITHUB_ENV"

          BASE="$(git merge-base HEAD "$CIP_REF" || true)"
          if [ -z "$BASE" ]; then
            echo "::error::Tree ${{ inputs.kernel_branch }} tidak berbagi riwayat git dengan ${CIP_BRANCH} (riwayat kernel upstream di-squash atau dipangkas), jadi merge tidak mungkin. Matikan input merge_cip, atau kirim log ini."
            exit 1
          fi
          echo "merge-base: $(git log -1 --format='%h %s (%cd)' "$BASE")"
          read -r AHEAD BEHIND < <(git rev-list --left-right --count HEAD..."$CIP_REF")
          echo "Tree punya ${AHEAD} commit di luar CIP; CIP punya ${BEHIND} commit yang belum ada di tree"
          if [ "$BEHIND" -eq 0 ]; then
            echo "::notice::Tidak ada commit CIP baru; tree sudah memuat seluruh ${CIP_BRANCH}"
            echo "CIP_MERGED=sudah-sama" >> "$GITHUB_ENV"; exit 0
          fi
          git diff --shortstat "$BASE" "$CIP_REF" || true

          PRE="$(git rev-parse HEAD)"
          set +e
          git merge --no-edit --no-ff -X ours -m "Merge ${CIP_BRANCH} (CIP)" "$CIP_REF" >/tmp/cip-merge.log 2>&1
          RC=$?
          set -e
          tail -5 /tmp/cip-merge.log || true
          if [ "$RC" -ne 0 ]; then
            # -X ours hanya menyelesaikan konflik isi. Konflik struktur (modify/delete, rename) dipilih ke sisi tree.
            git diff --name-only --diff-filter=U > /tmp/cip-conflicts.txt || true
            echo "== Konflik yang diselesaikan ke versi tree ($(wc -l < /tmp/cip-conflicts.txt)) =="
            head -60 /tmp/cip-conflicts.txt
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if git ls-files -u -- "$f" | awk '{print $3}' | grep -qx 2; then
                git checkout --ours -- "$f" && git add -- "$f"
              else
                git rm -q -f -- "$f"
              fi
            done < /tmp/cip-conflicts.txt
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              git merge --abort || true
              echo "::error::Konflik merge CIP tidak terselesaikan otomatis (lihat daftar di atas)."; exit 1
            fi
            git commit -q --no-edit
          fi
          # Kembalikan area kustom vendor ke versi tree (file tambahan dari CIP di area itu dibuang).
          for P in $CIP_KEEP_TREE; do
            git cat-file -e "$PRE:$P" 2>/dev/null || continue
            ADDED="$(git diff --no-renames --name-only --diff-filter=A "$PRE" HEAD -- "$P" || true)"
            if [ -n "$ADDED" ]; then echo "$ADDED" | xargs -r git rm -q -f --; fi
            git checkout "$PRE" -- "$P"
          done
          if ! git diff --cached --quiet; then
            echo "== File yang dikembalikan ke versi tree: $(git diff --cached --name-only | wc -l) =="
            git diff --cached --name-only | head -40
            git commit -q -m "Keep tree version for vendor-customized paths (CIP merge)"
          fi
          # Hanya baris yang DITAMBAHKAN oleh merge yang diperiksa: tree bawaan sudah membawa penanda konflik lama
          # (hfi_venus.c, test_overflow.c; file yang tidak ikut dibangun) dan itu bukan dari merge ini.
          MARK="$(git diff "$PRE" HEAD -- '*.c' '*.h' '*.S' '*Makefile*' '*Kconfig*' '*.dtsi' '*.dts' | grep -E '^\+(<<<<<<<|>>>>>>>) ' | head -20 || true)"
          if [ -n "$MARK" ]; then echo "$MARK"; echo "::error::Penanda konflik baru tertinggal setelah merge CIP"; exit 1; fi
          OLDMARK="$(git grep -lE '^(<<<<<<<|>>>>>>>) ' -- '*.c' '*.h' || true)"
          [ -z "$OLDMARK" ] || echo "::notice::Penanda konflik bawaan tree (bukan dari merge): $(echo $OLDMARK)"

          echo "CIP_MERGED=ya" >> "$GITHUB_ENV"
          echo "== Sesudah merge =="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) ' Makefile
          git diff --shortstat "$PRE" HEAD || true
          echo "::notice::Upstream CIP ${CIP_BRANCH} @ $(git rev-parse --short=8 "$CIP_REF") di-merge ke tree"

      - name: Bump versi source kernel (localversion-st)
        working-directory: kernel
        run: |
          set -eo pipefail
          git config user.name "ci"; git config user.email "ci@local"
          if [ -z "$ST_VERSION" ]; then
            # Ikut source asli: ambil angka dari localversion-st milik repo, tanpa menimpa
            ST_VERSION="$(grep -oE '[0-9]+' localversion-st 2>/dev/null | tail -1 || true)"
            [ -n "$ST_VERSION" ] || { echo "::error::localversion-st tidak ada/tidak berisi angka di source; isi input st_version"; exit 1; }
            echo "ST_VERSION=$ST_VERSION" >> "$GITHUB_ENV"
            echo "::notice::st_version kosong: mengikuti source asli (st${ST_VERSION}), tidak ditimpa"
            exit 0
          fi
          case "$ST_VERSION" in *[!0-9]*) echo "::error::st_version harus angka (dapat: '$ST_VERSION')"; exit 1 ;; esac
          if [ -s localversion-st ]; then
            echo "Sebelum: $(cat localversion-st)"
            # Ganti angka terakhir di file, format yang ada (mis. -st20) dipertahankan
            if grep -Eq '[0-9]' localversion-st; then
              sed -i -E "s/[0-9]+([^0-9]*)\$/${ST_VERSION}\1/" localversion-st
            else
              printf -- '-st%s\n' "$ST_VERSION" > localversion-st
            fi
          else
            printf -- '-st%s\n' "$ST_VERSION" > localversion-st
          fi
          echo "Sesudah: $(cat localversion-st)"
          grep -q "$ST_VERSION" localversion-st || { echo "::error::bump localversion-st gagal"; exit 1; }
          git add -f localversion-st
          git diff --cached --quiet || git commit -q -m "Bump version to st${ST_VERSION}"
          echo "::notice::Versi source: st${ST_VERSION}"

      - name: Integrasikan commit Maya Kernel (cherry-pick)
        if: ${{ env.MAYA_MERGE == 'true' }}
        working-directory: kernel
        run: |
          set -eo pipefail
          git config user.name "ci"; git config user.email "ci@local"
          git remote remove maya 2>/dev/null || true
          git remote add maya "$MAYA_REPO"
          # PENTING: ketiga commit di-fetch SEKALIGUS. Jika di-fetch satu per satu dengan --depth=2,
          # commit yang jadi parent commit lain (93669a2 = parent 76f94db) berubah jadi batas shallow
          # tanpa parent, sehingga cherry-pick-nya dianggap menambah seluruh tree dan konflik di mana-mana.
          # shellcheck disable=SC2086
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "::warning::percobaan $n/3 gagal: $*"; sleep $((n*10)); done; return 1; }
          retry git fetch -q --no-tags --depth=2 maya $MAYA_COMMITS \
            || { echo "::error::Gagal mengambil commit Maya Kernel dari $MAYA_REPO"; exit 1; }
          for C in $MAYA_COMMITS; do
            git rev-parse -q --verify "$C^{commit}" >/dev/null \
              || { echo "::error::Commit $C tidak ada setelah fetch"; exit 1; }
            # Sanity check: tiap commit harus punya parent (kalau tidak, cherry-pick akan salah)
            git rev-parse -q --verify "$C^" >/dev/null \
              || { echo "::error::Commit $C tidak punya parent setelah fetch (riwayat shallow terpotong)"; exit 1; }
            echo "  $(git diff --shortstat "$C^" "$C") <- ${C:0:8}"
          done
          # Urut dari yang terlama (parent dulu): 93669a2 adalah parent 76f94db
          ORDER="$(git rev-list --no-walk=sorted --reverse $MAYA_COMMITS)"
          echo "== Urutan cherry-pick =="
          for C in $ORDER; do git log -1 --format='%h %s (%cd)' "$C"; done
          PRE_MAYA="$(git rev-parse HEAD)"
          for C in $ORDER; do
            if git merge-base --is-ancestor "$C" HEAD 2>/dev/null; then
              echo "Sudah ada di tree, dilewati: ${C:0:8}"; continue
            fi
            echo "== cherry-pick ${C:0:8} =="
            if ! git cherry-pick -x "$C" >/tmp/maya-pick.log 2>&1; then
              if git diff --cached --quiet && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                git cherry-pick --skip >/dev/null 2>&1 || git cherry-pick --abort || true
                echo "::warning::${C:0:8} kosong (perubahan sudah ada di tree), dilewati"; continue
              fi
              CONF="$(git diff --name-only --diff-filter=U)"
              if [ -n "$CONF" ] && ! echo "$CONF" | grep -qv '^arch/arm64/configs/'; then
                # Konflik hanya di defconfig (isinya beda dengan tree Maya): pakai versi tree, lalu terapkan opsi CONFIG yang ditambah commit
                echo "::warning::${C:0:8}: konflik hanya di defconfig, diselesaikan = versi tree + opsi CONFIG dari commit"
                for F in $CONF; do
                  git checkout --ours -- "$F"
                  git show "$C" -- "$F" | grep -E '^\+(CONFIG_[A-Za-z0-9_]+=|# CONFIG_[A-Za-z0-9_]+ is not set)' | sed 's/^+//' > /tmp/maya-cfg.txt || true
                  while IFS= read -r L; do
                    [ -n "$L" ] || continue
                    SYM="$(echo "$L" | sed -E 's/^# //; s/[ =].*//')"
                    sed -i -E "/^(# )?${SYM}([= ]|$)/d" "$F"
                    echo "$L" >> "$F"
                  done < /tmp/maya-cfg.txt
                  git add -- "$F"
                  echo "  opsi dari ${C:0:8} diterapkan ke $F:"; sed 's/^/    /' /tmp/maya-cfg.txt
                done
                GIT_EDITOR=true git cherry-pick --continue >/dev/null
                continue
              fi
              tail -40 /tmp/maya-pick.log
              echo "== File konflik ($(echo "$CONF" | grep -c .)) =="; echo "$CONF" > /tmp/maya-conf.txt; head -60 /tmp/maya-conf.txt || true
              git cherry-pick --abort || true
              echo "::error::Cherry-pick ${C:0:8} konflik dengan tree. Beri tahu file konflik di atas, atau matikan input merge_maya."
              exit 1
            fi
          done
          # Penanda konflik baru tidak boleh tersisa
          MARK="$(git diff "$PRE_MAYA" HEAD 2>/dev/null | grep -E '^\+(<<<<<<<|>>>>>>>) ' | head -5 || true)"
          [ -z "$MARK" ] || { echo "$MARK"; echo "::error::Penanda konflik tertinggal"; exit 1; }
          echo "::notice::Commit Maya Kernel terintegrasi"
          git log --oneline -5

      - name: Pastikan tree bersih dari root/SUSFS bawaan
        working-directory: kernel
        run: |
          set -eo pipefail
          # Tree harus polos: root lama (ResukiSU/SukiSU/KernelSU dll) dan SUSFS lama bentrok dengan xxKSU + SUSFS baru.
          FOUND=""
          for p in fs/susfs.c fs/sus_su.c include/linux/susfs.h include/linux/susfs_def.h include/linux/sus_su.h \
                   drivers/kernelsu KernelSU; do
            [ -e "$p" ] && FOUND="$FOUND $p"
          done
          HITS="$(git grep -lE 'CONFIG_KSU|ksu_|susfs' -- '*.c' '*.h' 'Kconfig*' 'Makefile' 'arch/arm64/configs' || true)"
          if [ -n "$FOUND" ] || [ -n "$HITS" ]; then
            echo "== File/jejak root atau SUSFS lama =="
            echo "$FOUND"; echo "$HITS"
            echo "::error::Branch '${{ inputs.kernel_branch }}' sudah membawa root/SUSFS bawaan. Pakai branch bersih, atau kirim log ini untuk menyesuaikan workflow."
            exit 1
          fi
          echo "Tree bersih: tidak ada root/SUSFS bawaan"

